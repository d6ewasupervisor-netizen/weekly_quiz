<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P08W2 Quiz — District 8</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;background:#F0F4F8;color:#1B2A4A;padding:0 0 60px;-webkit-text-size-adjust:100%}
header{background:#1B2A4A;color:#fff;padding:24px 18px 20px;border-bottom:6px solid #0891B2}
header .tag{font-family:'Space Mono',monospace;font-size:12px;letter-spacing:3px;color:#F59E0B;text-transform:uppercase}
header h1{font-size:24px;margin-top:6px;line-height:1.2}
header p{font-size:14px;color:#AFC4DD;margin-top:8px;line-height:1.45}
.progwrap{position:sticky;top:0;z-index:5;background:#F0F4F8;padding:10px 18px 8px;border-bottom:1px solid #D8E2EE}
.progbar{height:8px;background:#D8E2EE;border-radius:99px;overflow:hidden}
.progfill{height:100%;width:0;background:#0891B2;transition:width .25s}
.progtxt{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:2px;color:#5A6B85;margin-top:6px;text-transform:uppercase}
main{padding:18px}
.namebox{background:#fff;border-radius:12px;padding:16px;margin-bottom:20px;box-shadow:0 2px 8px rgba(27,42,74,.09)}
.namebox label{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#0891B2;font-weight:700;display:block;margin-bottom:8px}
.namebox input{width:100%;font-family:'DM Sans',sans-serif;font-size:17px;padding:12px 14px;border:2px solid #D8E2EE;border-radius:8px;background:#F7FAFC}
.namebox input:focus{outline:0;border-color:#0891B2;background:#fff}
.q{background:#fff;border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 2px 8px rgba(27,42,74,.09)}
.qn{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:2px;color:#0891B2;font-weight:700;text-transform:uppercase}
.qt{font-size:17px;line-height:1.42;font-weight:500;margin:8px 0 14px}
.opt{display:flex;align-items:flex-start;gap:11px;padding:12px 13px;border:2px solid #E3EAF3;border-radius:9px;margin-bottom:9px;cursor:pointer;font-size:15px;line-height:1.4;background:#fff}
.opt:last-of-type{margin-bottom:0}
.opt .ltr{font-family:'Space Mono',monospace;font-weight:700;color:#5A6B85;flex:0 0 auto}
.opt.sel{border-color:#0891B2;background:#ECFEFF}
.opt.sel .ltr{color:#0891B2}
.opt input{display:none}
.locked .opt{cursor:default}
.opt.right{border-color:#10B981;background:#ECFDF5}
.opt.right .ltr{color:#059669}
.opt.wrong{border-color:#DC2626;background:#FEF2F2}
.opt.wrong .ltr{color:#DC2626}
.opt.wrong .txt{text-decoration:line-through;opacity:.72}
.fb{margin-top:12px;padding:12px 13px;border-radius:9px;font-size:14px;line-height:1.45;display:none}
.fb.show{display:block}
.fb.ok{background:#ECFDF5;border-left:5px solid #10B981}
.fb.no{background:#FEF3C7;border-left:5px solid #DC2626}
.fb b{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;display:block;margin-bottom:5px}
.fb.ok b{color:#059669}
.fb.no b{color:#DC2626}
#submit{width:100%;padding:17px;border:0;border-radius:11px;background:#0891B2;color:#fff;font-family:'DM Sans',sans-serif;font-size:18px;font-weight:700;cursor:pointer;margin-top:6px}
#submit:disabled{background:#B6C6D8;cursor:not-allowed}
#result{display:none;background:#1B2A4A;color:#fff;border-radius:12px;padding:24px 18px;text-align:center;margin-bottom:20px}
#result .score{font-family:'Space Mono',monospace;font-size:48px;font-weight:700;color:#F59E0B;line-height:1}
#result .pct{font-size:15px;color:#AFC4DD;margin-top:6px}
#result .verdict{font-size:17px;line-height:1.45;margin-top:14px}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.93);display:flex;align-items:center;justify-content:center;z-index:99}
.overlay-box{background:#fff;border-radius:14px;padding:34px 30px;text-align:center;min-width:250px;max-width:82vw}
.spinner{width:44px;height:44px;margin:0 auto 18px;border:5px solid #D8E2EE;border-top-color:#0891B2;border-radius:50%;animation:spin .85s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sync-msg{font-family:'Space Mono',monospace;font-size:14px;letter-spacing:2px;text-transform:uppercase;color:#1B2A4A;font-weight:700}
.sync-msg.done{color:#059669}
footer{text-align:center;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:2px;color:#8C9BB0;text-transform:uppercase;padding:22px 18px 0}
</style>
</head>
<body>

<header>
  <div class="tag">Period 8 &middot; Week 2 &middot; District 8</div>
  <h1>Weekly Recap Quiz</h1>
  <p>Twenty questions, all of it straight from the recap. Answer everything, then submit &mdash; results come to me automatically.</p>
</header>

<div class="progwrap">
  <div class="progbar"><div class="progfill" id="progfill"></div></div>
  <div class="progtxt" id="progtxt">0 of 20 answered</div>
</div>

<main>
  <div class="namebox">
    <label for="name">Your name</label>
    <input type="text" id="name" autocomplete="name" placeholder="First and last name">
  </div>

  <div id="result">
    <div class="score" id="scoreline">0 / 20</div>
    <div class="pct" id="pctline">0%</div>
    <div class="verdict" id="verdictline"></div>
  </div>

  <div id="quiz"></div>

  <button id="submit" disabled>Submit answers</button>
</main>

<footer>Retail Odyssey &middot; District 8 &middot; Division 701</footer>

<script>
const PERIOD_WEEK = "P08W2";
const ENDPOINT = "https://script.google.com/macros/s/AKfycbzmcP_mKbuBt-pY1zMGhgrgOWae3uI72PreeTaQTHJDc1Uj4oGq424zRRsdZ8YKo8c1/exec";

const QUESTIONS = [
{q:"On the Soap set, where should you start and which direction do you work?",
 o:["Start in hand soap and work right to left","Start at the far left and work left to right","Start in bar soap and work outward","Start in the middle and work both directions"],
 a:0,
 e:"The liquid hand soaps shrink and the rest of the set expands toward them, so starting in hand soap and working right to left is what worked on the test set."},

{q:"What was the known issue with close-outs on the Soap set?",
 o:["They were tagged twice by mistake","Most of them came through without close-out tags","They were all pulled before we arrived","They were tagged but with the wrong prices"],
 a:1,
 e:"Most close-outs were not tagged with close-out tags, so you have to catch them yourself while setting."},

{q:"Who installs the Dr. Squatch rack?",
 o:["Whoever is on the soap set that day","The store's grocery manager","Their own vendor rep, a few weeks after posting","Nobody &mdash; it ships pre-assembled"],
 a:2,
 e:"Their rep visits two to three weeks after posting to install it. We are not setting it and no materials are coming to us for it."},

{q:"In Oral Care, where does nearly all of the eight hours go?",
 o:["Mouthwash and denture","Toothpaste and adult toothbrushes","Whitening strips","Kids oral care"],
 a:1,
 e:"Mouthwash and denture run fast &mdash; a little over an hour for the pair on the test. Toothpaste and adult toothbrushes carry the rest."},

{q:"On Oral Care sets that are 20 ft and larger, what happens to the vertical toothpaste items on the top shelf?",
 o:["They stay on top exactly as they are","They flip horizontal and move down into the set next to like items","They move to the bottom shelf as a block","They are deleted from the set"],
 a:1,
 e:"On 20 ft and larger they flip horizontal and drop down into the set. On 16 ft and smaller they stay up top to make room for assortment &mdash; check your set size first."},

{q:"Where should you start on the toothbrush section?",
 o:["The bottom shelf","The top shelf","The Our Brands block","Wherever the deletes are heaviest"],
 a:1,
 e:"Toothbrushes move mostly side to side, and starting at the top shelf worked best on the test set."},

{q:"What is the watch-out on denture shelf 2?",
 o:["The shelf has to be lowered two notches","Wide gaps where the pushers are spread out and barely catch product","The strip does not match the planogram","Two items have to stand up instead of lay down"],
 a:1,
 e:"Shelf 2 has a lot of extra space, so the pushers spread out and barely catch the product. It matches the strip &mdash; it just looks a little odd, and the store is fine with it. The stand-up items are on shelf 1."},

{q:"What should you plan for on the Cake D&eacute;cor set?",
 o:["A full reflow of the whole set","Shelves 2 and 3 moved up to fit the new Wilton Decorating Bags tray","Removing an entire bay","Moving the set to a new aisle"],
 a:1,
 e:"There is no structural rework &mdash; new items come into the existing set. Most stores will need shelves 2 and 3 moved up to fit the new tray, so build that into your plan."},

{q:"Which set should be knocked out first thing unless you have been told otherwise?",
 o:["Soap","Oral Care","Dry Processed on the Fresh Gourmet overhead racks","Cake D&eacute;cor"],
 a:2,
 e:"Dry Processed is a produce set on the Fresh Gourmet overhead racks, and produce sets go first unless another priority has been set for that week."},

{q:"How long can product from a temperature-controlled set be left out?",
 o:["Ten minutes","Twenty minutes","Forty-five minutes","As long as it takes to finish the bay"],
 a:1,
 e:"Twenty minutes, no exceptions. Work in batches on the cold sets and it stops being an issue."},

{q:"What happens to vendor branding &mdash; strips and stickers &mdash; on bakery racks?",
 o:["It gets removed and given to the bakery department","It stays exactly where it is","It gets replaced with our own strips","It comes off only if the rack is being moved"],
 a:1,
 e:"That branding is part of the store's agreement with the vendor, so it stays in place. Same goes for the romance identifier tags on artisan bread and Eurobake."},

{q:"On a bakery table reset, where does the new planogram go?",
 o:["Into the plastic sleeve attached to the table","Onto the Kompass cart","Taped to the end cap","It gets recycled once the set is done"],
 a:0,
 e:"Bakery table resets get the new planogram in the plastic sleeve on the table. Everything else goes to the Bakery department so they have it for reference."},

{q:"How often should you be checking in with a store manager?",
 o:["Only when there is a problem to report","Every visit","Once a week","Only if they approach you first"],
 a:1,
 e:"Every visit. We are often in before they are on shift, but you are both walking the store &mdash; stop, say hello, and give them a quick rundown. If there is nothing to report, it is just a hello."},

{q:"What happens to the outgoing limited time edition Oreo flavor?",
 o:["It gets close-out tags like anything else","Mondelez collects it themselves, and there are no close-out tags","We box it and hand it to the store","It stays on the set until it sells through"],
 a:1,
 e:"There are no close-out tags on it &mdash; Mondelez picks up the prior period's edition themselves."},

{q:"On the Feminine Hygiene set, how do the seven new items get ordered?",
 o:["Alphabetically by brand","Biggest to smallest &mdash; sizes 5, 4, 3, 2, 1","Smallest to biggest &mdash; sizes 1, 2, 3, 4, 5","By price point, low to high"],
 a:1,
 e:"All seven go into the Always Radiant and Always Infinity block, ordered biggest to smallest. Nothing comes out to make room."},

{q:"What is the standard for backstock and not-in-set product?",
 o:["Leave it on the cart for the next visit","Every box leaves the visit clearly labeled","Hand it directly to a manager","Combine it all into one unmarked box"],
 a:1,
 e:"Every box gets a label. They are in A Useful Folder in the dump bin &mdash; fax them to yourself, tear or cut them apart, and fasten them to the banana boxes. Blank tags from the price change room work well for this."},

{q:"What do you do with shelves that come out of a set?",
 o:["Lean them somewhere out of the way in the back","Put them in the appropriate storage area for that specific store","Leave them beside the set for the store to deal with","Stack them on the Kompass cart"],
 a:1,
 e:"Every store is laid out differently, so there is no single right answer &mdash; but leaving them leaning against whatever was nearest is the wrong one. Find out where that store wants them and put them there."},

{q:"When should the new items be pulled off the Kompass cart?",
 o:["In the morning, so they go out with the crew when the reset starts","At the end of the day once the set is finished","Whenever there is a gap in the schedule","Only on visits where there is spare time"],
 a:0,
 e:"Pull them in the morning and send them out with the crew at the start of the reset. Putting new product on the shelf is the reason this job exists &mdash; it does not get left to the last hour."},

{q:"What has to happen before anyone works a refrigerated, frozen, cooler or produce set?",
 o:["They have to have completed a full set on their own first","They have to be walked through that store's cold storage in the back","They have to get manager approval in writing","Nothing specific &mdash; the planogram covers it"],
 a:1,
 e:"Every store has a cooler room for produce, a refrigerator for items like kombucha and eggs, a dairy cooler for milk, and a freezer for ice cream and frozen dinners. Product has to land in the right one, so the walkthrough comes before the work, not after."},

{q:"What is coming in Period 8 Week 4 that affects eight of our ten stores?",
 o:["A full remodel of the grocery aisles","Paper Housewares combining with Napkins","A district-wide inventory count","The fall spirits reset"],
 a:1,
 e:"Paper Housewares and Napkins combine at eight of our ten stores. That brings merchandising changes and real shelving moves, not just an assortment swap."}
];

const LETTERS = ["A","B","C","D"];
const answers = new Array(QUESTIONS.length).fill(null);
let locked = false;

const quizEl = document.getElementById("quiz");
const nameEl = document.getElementById("name");
const submitEl = document.getElementById("submit");

QUESTIONS.forEach(function(item, qi){
  const card = document.createElement("div");
  card.className = "q";
  card.id = "q" + qi;
  let html = '<div class="qn">Question ' + (qi + 1) + '</div><div class="qt">' + item.q + '</div>';
  item.o.forEach(function(opt, oi){
    html += '<label class="opt" data-q="' + qi + '" data-o="' + oi + '">' +
            '<span class="ltr">' + LETTERS[oi] + '</span><span class="txt">' + opt + '</span>' +
            '<input type="radio" name="q' + qi + '"></label>';
  });
  html += '<div class="fb" id="fb' + qi + '"></div>';
  card.innerHTML = html;
  quizEl.appendChild(card);
});

quizEl.addEventListener("click", function(ev){
  const lab = ev.target.closest(".opt");
  if (!lab || locked) return;
  const qi = +lab.dataset.q, oi = +lab.dataset.o;
  answers[qi] = oi;
  document.querySelectorAll('.opt[data-q="' + qi + '"]').forEach(function(el){ el.classList.remove("sel"); });
  lab.classList.add("sel");
  refresh();
});

nameEl.addEventListener("input", refresh);

function refresh(){
  const done = answers.filter(function(a){ return a !== null; }).length;
  document.getElementById("progfill").style.width = (done / QUESTIONS.length * 100) + "%";
  document.getElementById("progtxt").textContent = done + " of " + QUESTIONS.length + " answered";
  submitEl.disabled = locked || done < QUESTIONS.length || nameEl.value.trim().length < 2;
}

function verdictFor(score){
  if (score === 20) return "Perfect. You were paying attention.";
  if (score >= 16) return "Solid. Review the ones you missed.";
  if (score >= 12) return "Watch the recap again \u2014 key details got past you.";
  return "Go back and watch the full recap before your next shift.";
}

submitEl.addEventListener("click", function(){
  if (submitEl.disabled) return;

  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = '<div class="overlay-box"><div class="spinner" id="spin"></div><div class="sync-msg" id="syncmsg">Buffering...</div></div>';
  document.body.appendChild(overlay);

  let score = 0;
  const missed = [];
  QUESTIONS.forEach(function(item, qi){
    if (answers[qi] === item.a) { score++; } else { missed.push(qi + 1); }
  });
  const pct = Math.round(score / QUESTIONS.length * 100);
  const payload = {
    timestamp: new Date().toISOString(),
    periodWeek: PERIOD_WEEK,
    name: nameEl.value.trim(),
    score: score,
    outOf: QUESTIONS.length,
    percent: pct,
    missed: missed.join(", ")
  };

  let posted = true;
  fetch(ENDPOINT, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  }).catch(function(){ posted = false; });

  setTimeout(function(){
    document.getElementById("spin").style.display = "none";
    const msg = document.getElementById("syncmsg");
    msg.textContent = "Your results have been submitted.";
    msg.classList.add("done");

    setTimeout(function(){
      overlay.remove();
      reveal(score, pct, posted);
    }, 2000);
  }, 1500);
});

function reveal(score, pct, posted){
  locked = true;
  submitEl.disabled = true;
  submitEl.textContent = "Submitted";

  QUESTIONS.forEach(function(item, qi){
    const card = document.getElementById("q" + qi);
    card.classList.add("locked");
    const opts = card.querySelectorAll(".opt");
    opts.forEach(function(el, oi){
      el.classList.remove("sel");
      if (oi === item.a) el.classList.add("right");
      else if (oi === answers[qi]) el.classList.add("wrong");
    });
    const fb = document.getElementById("fb" + qi);
    const right = answers[qi] === item.a;
    fb.className = "fb show " + (right ? "ok" : "no");
    fb.innerHTML = "<b>" + (right ? "Correct" : "Correct answer: " + LETTERS[item.a]) + "</b>" + item.e;
  });

  let verdict = verdictFor(score);
  if (!posted) verdict += " Screenshot this and send it to me.";

  document.getElementById("scoreline").textContent = score + " / " + QUESTIONS.length;
  document.getElementById("pctline").textContent = pct + "%";
  document.getElementById("verdictline").textContent = verdict;
  const res = document.getElementById("result");
  res.style.display = "block";
  res.scrollIntoView({ behavior: "smooth", block: "center" });
}

refresh();
</script>
</body>
</html>
