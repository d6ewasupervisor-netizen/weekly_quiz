<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>P08W3 Quiz &mdash; District 8</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',system-ui,sans-serif;background:#0F1B33;color:#1B2A4A;padding:0 0 60px}
.top{background:#1B2A4A;color:#fff;padding:26px 20px 22px;border-bottom:6px solid #0891B2}
.top .k{font-family:'Space Mono',monospace;font-size:12px;letter-spacing:3px;color:#0891B2;text-transform:uppercase}
.top h1{font-size:26px;margin-top:6px;font-weight:700}
.top p{color:#9BB4D6;font-size:14px;margin-top:6px}
.progwrap{position:sticky;top:0;height:8px;background:#213c66;z-index:20}
.prog{height:100%;width:0;background:#F59E0B;transition:width .25s}
.wrap{max-width:680px;margin:0 auto;padding:18px 16px}
.namebox{background:#fff;border-radius:12px;padding:18px;margin-bottom:20px}
label{font-family:'Space Mono',monospace;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#0891B2;display:block;margin-bottom:8px;font-weight:700}
input{width:100%;padding:14px;font-size:17px;font-family:'DM Sans',sans-serif;border:2px solid #CBD8E8;border-radius:8px;outline:none}
input:focus{border-color:#0891B2}
.q{background:#fff;border-radius:12px;padding:20px;margin-bottom:16px}
.qn{font-family:'Space Mono',monospace;font-size:12px;color:#0891B2;letter-spacing:2px;font-weight:700;margin-bottom:8px}
.qt{font-size:18px;font-weight:500;line-height:1.4;margin-bottom:14px}
.opt{display:flex;gap:11px;align-items:flex-start;padding:13px 14px;border:2px solid #E2E9F2;border-radius:9px;margin-bottom:9px;cursor:pointer;font-size:16px;line-height:1.35;transition:.12s}
.opt:last-of-type{margin-bottom:0}
.opt:hover{border-color:#0891B2;background:#F4FCFE}
.opt .ltr{font-family:'Space Mono',monospace;font-weight:700;color:#0891B2;flex:0 0 auto}
.opt.sel{border-color:#0891B2;background:#ECFEFF}
.opt input{display:none}
.locked .opt{cursor:default}
.locked .opt:hover{border-color:#E2E9F2;background:#fff}
.opt.right{border-color:#16A34A;background:#F0FDF4}
.opt.right .ltr{color:#16A34A}
.opt.wrong{border-color:#DC2626;background:#FEF2F2;text-decoration:line-through}
.opt.wrong .ltr{color:#DC2626;text-decoration:none}
.opt.locked-right:hover{border-color:#16A34A;background:#F0FDF4}
.fb{margin-top:12px;padding:13px 15px;border-radius:8px;font-size:15px;line-height:1.45;display:none}
.fb.show{display:block}
.fb.ok{background:#F0FDF4;border-left:5px solid #16A34A}
.fb.no{background:#FEF3C7;border-left:5px solid #DC2626}
.fb b{font-family:'Space Mono',monospace;font-size:12px;letter-spacing:2px;text-transform:uppercase;display:block;margin-bottom:5px}
.fb.ok b{color:#16A34A}.fb.no b{color:#DC2626}
button{width:100%;padding:18px;font-family:'Space Mono',monospace;font-size:16px;letter-spacing:2px;font-weight:700;text-transform:uppercase;background:#F59E0B;color:#1B2A4A;border:none;border-radius:10px;cursor:pointer;margin-top:8px}
button:disabled{background:#4A5F82;color:#9BB4D6;cursor:not-allowed}
.score{background:#1B2A4A;color:#fff;border-radius:12px;padding:28px 22px;text-align:center;margin-bottom:18px;display:none}
.score.show{display:block}
.score .n{font-size:64px;font-weight:700;color:#F59E0B;line-height:1}
.score .v{font-size:17px;margin-top:12px;line-height:1.45;color:#DCE6F5}
.score .pct{font-family:'Space Mono',monospace;font-size:13px;letter-spacing:3px;color:#0891B2;margin-top:10px}
.overlay{position:fixed;inset:0;background:rgba(15,27,51,.96);display:none;align-items:center;justify-content:center;z-index:99}
.overlay.show{display:flex}
.overlay-box{background:#fff;border-radius:14px;padding:38px 34px;text-align:center;max-width:320px;width:86%}
.spinner{width:46px;height:46px;border:5px solid #E2E9F2;border-top-color:#0891B2;border-radius:50%;margin:0 auto 18px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner.hide{display:none}
.sync-msg{font-family:'Space Mono',monospace;font-size:14px;letter-spacing:1px;color:#1B2A4A}
.sync-msg.done{color:#16A34A;font-weight:700}
</style></head><body>
<div class="progwrap"><div class="prog" id="prog"></div></div>
<div class="top"><div class="k">Period 8 &middot; Week 3 &middot; District 8</div>
<h1>Pop Quiz</h1><p>20 questions. Answer them all, then submit. Results come straight to me.</p></div>
<div class="wrap">
<div class="namebox"><label for="nm">Your Name</label><input id="nm" type="text" placeholder="First and last" autocomplete="name"></div>
<div id="qs"></div>
<button id="sub" disabled>Submit Quiz</button>
</div>
<div class="score" id="score" style="max-width:648px;margin:0 auto 18px"></div>
<div class="overlay" id="ov"><div class="overlay-box">
<div class="spinner" id="sp"></div><div class="sync-msg" id="sm">Buffering&hellip;</div></div></div>
<script>
const PERIOD_WEEK="P08W3";
const ENDPOINT="https://script.google.com/macros/s/AKfycbzmcP_mKbuBt-pY1zMGhgrgOWae3uI72PreeTaQTHJDc1Uj4oGq424zRRsdZ8YKo8c1/exec";
const Q=[{"n": 1, "q": "How many Kompass hours is District 8 carrying this week?", "o": ["Thirty-five hours", "Eight hours", "Eleven hours", "Twelve hours"], "c": 2, "e": "Eleven hours across five Kompass sets. Thirty-five is the projection for the week after next."}, {"n": 2, "q": "Where do the deletes for C112 Bath Tissue live?", "o": ["On the shelf strips", "On the planogram", "In the Vestcom box", "In the Kompass Notes only"], "c": 3, "e": "They are in the Kompass Notes only, not on the planogram. Setting from the planogram alone leaves discontinued product on the shelf."}, {"n": 3, "q": "What is the Kroger Ultra flow change on C112?", "o": ["Ultra Soft (blue) then Ultra Strong (red)", "Kroger Ultra is discontinued", "Kroger Ultra moves to the top shelf", "Ultra Strong (red) then Ultra Soft (blue)"], "c": 0, "e": "Ultra Soft in blue leads, then Ultra Strong in red. Easy one to set backwards from memory."}, {"n": 4, "q": "On C112 sets that carry a third shelf with wipes, what may happen?", "o": ["The shelf moves to the top of the set", "Nothing changes", "The shelf is removed entirely", "The shelf may shift a bay left or right depending on flow direction"], "c": 3, "e": "The wipes shelf may shift a bay left or right depending on which way your flow runs. It ties back to the Ultra reflow and only hits a small number of stores."}, {"n": 5, "q": "How many Kompass sets is District 8 executing this week?", "o": ["Seven", "Five", "Eleven", "Three"], "c": 1, "e": "Five Kompass sets: C112 Bath Tissue, C111 Paper Towels, C161 Baby HBC, C169 Shave and C237 Infant GM. C270 Beer and C813 Cosmetics are vendor windows."}, {"n": 6, "q": "The C111 talking points reference the Michigan and Mid Atlantic divisions. What do you do with those callouts?", "o": ["Apply them to your store", "Apply only the Michigan one", "Email the helpdesk for clarification", "Ignore both \u2014 neither is ours"], "c": 3, "e": "Neither division is ours. Ignore both and set to the planogram printed for your store."}, {"n": 7, "q": "What happens to merchandising height on the new C111 Paper Towels core set?", "o": ["It stays exactly the same", "It goes up about two inches", "It comes down to 65 inches", "It comes down from about 78 inches to about 75"], "c": 3, "e": "It drops from just under 78 inches to just over 75. Expect to move shelves."}, {"n": 8, "q": "What happens to merchandising height on the new C112 Bath Tissue core set?", "o": ["It holds at 86 inches", "It rises to 92 inches", "It drops about ten inches", "It varies by store"], "c": 0, "e": "It holds at 86 inches. The work on Bath Tissue is flow, not fixture."}, {"n": 9, "q": "Which category rides along with C111 Paper Towels this week?", "o": ["C114 Paper Housewares", "C295 Natural Foods Paper", "C384 RTD Coffee", "C152 Napkins"], "c": 1, "e": "C295 Natural Foods Paper is included and receives its own new item strips."}, {"n": 10, "q": "On C169 Shave, where do the two new razorless shave creams get merchandised?", "o": ["In a separate endcap", "On the women's peg board", "Next to Nair in the combo sets", "On the top shelf of the men's set"], "c": 2, "e": "Next to Nair in the combo sets, reducing facings as needed to make them fit."}, {"n": 11, "q": "What changes on the women's side of C169 Shave?", "o": ["A full reflow", "The section is removed", "No peg board changes \u2014 facings adjusted only to help packout", "Three new items are added"], "c": 2, "e": "No changes to the peg board. Facings were adjusted only to help packout."}, {"n": 12, "q": "What kind of work is C237 Infant GM this week?", "o": ["A vendor set", "A full reflow", "Case pack updates only", "New item introduction with 7 new items"], "c": 2, "e": "Case pack updates only. Nothing physically moves on that one."}, {"n": 13, "q": "When were the District 8 Vestcom boxes delivered?", "o": ["They are still in transit", "Only six have arrived", "Friday, August 28th", "Wednesday, August 26th \u2014 all ten"], "c": 3, "e": "All ten District 8 boxes were delivered Wednesday, August 26th. Nothing outstanding."}, {"n": 14, "q": "Which District 8 store received a cosmetics box this week?", "o": ["All ten stores", "Store 23", "Store 658", "Store 19"], "c": 3, "e": "Store 19 only. Cosmetics ships in its own Vestcom box with separate tracking \u2014 do not dig through the main box for it."}, {"n": 15, "q": "C111 Paper Towels planograms were renamed. From what to what?", "o": ["C111 to C295", "D701 to D703", "Department 01 to Department 03", "Department 03 to Department 01"], "c": 2, "e": "From Department 01 to Department 03. Same set, same planogram \u2014 only the department number in the file name changed. Search under the old number and you won't find it."}, {"n": 16, "q": "What are the cut-in shift deadlines?", "o": ["Wrapped by 10 AM, out by 3 PM, EOD by 4 PM", "No set deadlines", "Wrapped by 8 AM, out by 2 PM, EOD by 2:30", "Wrapped by 9 AM, out by 2:30, EOD by 3 PM"], "c": 3, "e": "Cut-in shifts wrapped up by 9, out of the store by 2:30, EOD sent by 3. Heads up as soon as you see either slipping \u2014 not after."}, {"n": 17, "q": "Before contacting the Kompass helpdesk, what has to happen?", "o": ["It gets cleared through me first", "You wait 24 hours", "You email the store manager", "Nothing \u2014 contact them directly"], "c": 0, "e": "Any contact with the helpdesk gets cleared through me first."}, {"n": 18, "q": "Store 28 has two inventory counts this week. Which days?", "o": ["Monday and Tuesday", "Wednesday 9/2 and Thursday 9/3", "Thursday 9/3 and Friday 9/4", "Tuesday 9/1 and Wednesday 9/2"], "c": 1, "e": "Wednesday, September 2nd for Home and PEM, and Thursday, September 3rd for apparel. Both are home side \u2014 center store is not in play."}, {"n": 19, "q": "How many Kompass hours are projected for the week after next, P08W4?", "o": ["Twenty hours", "Forty-three hours", "Eleven hours", "Thirty-five hours"], "c": 3, "e": "Thirty-five hours across fifteen commodities. Worth knowing now so it doesn't surprise anyone."}, {"n": 20, "q": "C114 Paper Housewares is an adjacency project the week after next. How many of our ten stores does it hit, and what does it combine with?", "o": ["Four of ten stores, combines with C152 Napkins", "Eight of ten stores, combines with C152 Napkins", "All ten stores, combines with C295 NF Paper", "Six of ten stores, combines with C111 Paper Towels"], "c": 1, "e": "Eight of our ten stores \u2014 19, 23, 31, 215, 391, 459, 658 and 682 \u2014 and it combines with C152 Napkins. Napkins shift left on the planogram and there are shelving moves."}];
const L=["A","B","C","D"];
let ans={},locked=false;
const qsEl=document.getElementById('qs');
Q.forEach(function(q){
  const d=document.createElement('div');d.className='q';d.id='q'+q.n;
  let h='<div class="qn">Question '+q.n+' of 20</div><div class="qt">'+q.q+'</div>';
  q.o.forEach(function(o,i){h+='<div class="opt" data-q="'+q.n+'" data-i="'+i+'"><span class="ltr">'+L[i]+'</span><span>'+o+'</span></div>';});
  h+='<div class="fb" id="fb'+q.n+'"></div>';d.innerHTML=h;qsEl.appendChild(d);
});
document.querySelectorAll('.opt').forEach(function(el){
  el.addEventListener('click',function(){
    if(locked)return;
    const qn=el.dataset.q;
    document.querySelectorAll('.opt[data-q="'+qn+'"]').forEach(function(o){o.classList.remove('sel')});
    el.classList.add('sel');ans[qn]=parseInt(el.dataset.i);upd();
  });
});
document.getElementById('nm').addEventListener('input',upd);
function upd(){
  const n=Object.keys(ans).length;
  document.getElementById('prog').style.width=(n/20*100)+'%';
  document.getElementById('sub').disabled=!(n===20&&document.getElementById('nm').value.trim().length>1);
}
document.getElementById('sub').addEventListener('click',function(){
  if(locked)return;locked=true;
  const ov=document.getElementById('ov'),sp=document.getElementById('sp'),sm=document.getElementById('sm');
  ov.classList.add('show');
  let score=0,missed=[];
  Q.forEach(function(q){
    const a=ans[q.n];const correct=(a===q.c);if(correct)score++;else missed.push(q.n);
    const box=document.getElementById('q'+q.n);box.classList.add('locked');
    document.querySelectorAll('.opt[data-q="'+q.n+'"]').forEach(function(o){
      const i=parseInt(o.dataset.i);o.classList.remove('sel');
      if(i===q.c)o.classList.add('right','locked-right');
      else if(i===a)o.classList.add('wrong');
    });
    const fb=document.getElementById('fb'+q.n);
    fb.className='fb show '+(correct?'ok':'no');
    fb.innerHTML='<b>'+(correct?'Correct':'Missed it')+'</b>'+q.e;
  });
  const pct=Math.round(score/20*100);
  let v;
  if(score===20)v="Perfect. You were paying attention.";
  else if(score>=17)v="Solid. Look at the ones you missed before Monday.";
  else if(score>=13)v="Watch it again — key details got past you.";
  else v="Go back and watch the full briefing before your next shift.";
  const body={timestamp:new Date().toISOString(),periodWeek:PERIOD_WEEK,name:document.getElementById('nm').value.trim(),score:score,outOf:20,percent:pct,missed:missed.join(", ")};
  try{fetch(ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});}catch(e){}
  setTimeout(function(){sp.classList.add('hide');sm.textContent="Your results have been submitted.";sm.classList.add('done');},1500);
  setTimeout(function(){
    ov.classList.remove('show');
    const s=document.getElementById('score');
    s.innerHTML='<div class="n">'+score+' / 20</div><div class="pct">'+pct+'%</div><div class="v">'+v+'</div>';
    s.classList.add('show');
    document.getElementById('sub').style.display='none';
    s.scrollIntoView({behavior:'smooth'});
  },3500);
});
</script></body></html>
