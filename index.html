<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>District 8 Weekly Quiz &mdash; P09W4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:#1B2A4A; --teal:#0891B2; --orange:#F59E0B; --red:#DC2626;
    --lightyellow:#FEF3C7; --lightblue:#ECFEFF; --bg:#F0F4F8;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--navy); padding-bottom:60px; }
  header { background:var(--navy); color:#fff; padding:28px 20px 22px; text-align:center; }
  header .kicker { font-family:'Space Mono',monospace; color:#7dd3e0; letter-spacing:2px; font-size:13px; text-transform:uppercase; }
  header h1 { margin:8px 0 0; font-size:26px; }
  .progress-wrap { max-width:640px; margin:18px auto 0; padding:0 16px; }
  .progress-bar { background:#dde6ee; border-radius:999px; height:10px; overflow:hidden; }
  .progress-fill { background:linear-gradient(90deg,var(--teal),var(--orange)); height:100%; width:0%; transition:width .25s ease; }
  .progress-label { font-family:'Space Mono',monospace; font-size:12px; color:#46607a; margin-top:6px; text-align:right; }
  main { max-width:640px; margin:0 auto; padding:16px; }
  .name-card { background:#fff; border-radius:16px; padding:18px 20px; box-shadow:0 6px 18px rgba(27,42,74,.08); margin-bottom:20px; }
  .name-card label { font-weight:700; font-size:14px; display:block; margin-bottom:8px; }
  .name-card input { width:100%; padding:12px 14px; border-radius:10px; border:2px solid #dde6ee; font-size:16px; font-family:'DM Sans',sans-serif; }
  .name-card input:focus { outline:none; border-color:var(--teal); }
  .qcard { background:#fff; border-radius:16px; padding:20px; margin-bottom:16px; box-shadow:0 6px 18px rgba(27,42,74,.08); }
  .qnum { font-family:'Space Mono',monospace; color:var(--teal); font-size:12px; font-weight:700; letter-spacing:1px; }
  .qtext { font-weight:700; font-size:17px; margin:6px 0 14px; line-height:1.4; }
  .opt { display:block; width:100%; text-align:left; padding:12px 14px; margin-bottom:10px; border-radius:10px; border:2px solid #dde6ee; background:#fbfdff; font-size:15px; font-family:'DM Sans',sans-serif; cursor:pointer; transition:all .15s ease; }
  .opt:hover { border-color:var(--teal); }
  .opt.selected { border-color:var(--navy); background:#eef3f8; font-weight:700; }
  .opt.correct { background:#dcfce7; border-color:#16a34a; font-weight:700; }
  .opt.wrong { background:#fee2e2; border-color:var(--red); text-decoration:line-through; }
  .feedback { margin-top:10px; padding:12px 14px; border-radius:10px; font-size:14px; line-height:1.5; display:none; }
  .feedback.show { display:block; }
  .feedback.right { background:var(--lightblue); color:#0e5a6b; }
  .feedback.miss { background:var(--lightyellow); color:#92400e; }
  #submitBtn { width:100%; padding:16px; border:none; border-radius:12px; background:var(--navy); color:#fff; font-size:17px; font-weight:700; font-family:'DM Sans',sans-serif; cursor:pointer; margin-top:10px; }
  #submitBtn:disabled { background:#a9bcce; cursor:not-allowed; }
  .result-card { background:var(--navy); color:#fff; border-radius:16px; padding:26px 22px; text-align:center; margin-bottom:20px; }
  .result-score { font-family:'Space Mono',monospace; font-size:42px; font-weight:700; color:var(--orange); }
  .result-verdict { font-size:17px; margin-top:8px; }
  .overlay { position:fixed; inset:0; background:rgba(27,42,74,.92); display:flex; align-items:center; justify-content:center; z-index:999; }
  .overlay-box { background:#fff; border-radius:18px; padding:40px 36px; text-align:center; min-width:240px; }
  .spinner { width:44px; height:44px; border:5px solid #dde6ee; border-top-color:var(--teal); border-radius:50%; margin:0 auto 18px; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .sync-msg { font-weight:700; color:var(--navy); font-size:16px; }
  .hidden { display:none; }
</style>
</head>
<body>
<header>
  <div class="kicker">District 8 &middot; Weekly Check</div>
  <h1>P09W4 Quiz</h1>
</header>
<div class="progress-wrap">
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-label" id="progressLabel">0 / 20 answered</div>
</div>
<main>
  <div class="name-card">
    <label for="nameInput">Your name</label>
    <input type="text" id="nameInput" placeholder="Type your name" autocomplete="off">
  </div>
  <div id="quizBody"></div>
  <button id="submitBtn" disabled>Submit Quiz</button>
  <div id="resultArea"></div>
</main>

<div class="overlay hidden" id="overlay">
  <div class="overlay-box">
    <div class="spinner" id="spinner"></div>
    <div class="sync-msg" id="syncMsg">Buffering...</div>
  </div>
</div>

<script>
const QUESTIONS = [{"q": "How much Compass time is on the books this week, and what rides on top of it?", "options": ["30 hours of Kompass, plus 36 hours of Stationery", "36 hours total, Stationery included", "53 hours of Kompass, no Stationery", "36 hours of Kompass, plus about 30 hours of Stationery"], "correct": 3, "explain": "36 hours of Kompass, plus roughly 30 hours of Stationery. Stationery gets set this week on top of Kompass, not instead of it."}, {"q": "Which set is the priority headliner this week?", "options": ["Dressings & Dips", "Charcoal & Firelogs", "Laundry Detergents", "Salty Snacks"], "correct": 3, "explain": "Salty Snacks is the 16-hour priority set, tied to a division PepsiCo/Lay's test."}, {"q": "You service a store Monday and Wednesday. When do you set Salty Snacks?", "options": ["Monday, first thing", "Wednesday, the second service day", "Whichever day the vendor is in", "Split it across both days"], "correct": 1, "explain": "Multi-day stores work Salty Snacks on the second service day, so a Monday/Wednesday store sets it Wednesday."}, {"q": "For a single-visit store, where does Salty Snacks fall in the day?", "options": ["Right after your fresh sets", "Before everything, including fresh", "Last, after all other sets", "After Stationery"], "correct": 0, "explain": "Everyone else treats Salty Snacks as the priority right after the fresh sets."}, {"q": "What's the action item for your stores' chip vendors?", "options": ["Ask them to set the Takis endcap for us", "Ask them to pull their own overstock before we arrive", "Ask them to bring new product to the fuel center", "Tell them we'll be in early to set Salty Snacks and ask them to save boxes"], "correct": 3, "explain": "Let the chip vendors know we'll be in early to set Salty Snacks, and ask them to save boxes for us."}, {"q": "You can't reach your store's chip vendors. Who do you contact at a minimum?", "options": ["The pharmacy manager", "The fuel center associate", "The store's grocery receiver", "The relay team"], "correct": 2, "explain": "At minimum, talk to the store's grocery receiver so they know we're in early and can save boxes."}, {"q": "Which District 8 stores have the Takis (Barcel) endcap on their strip manifest?", "options": ["19, 28 and 215", "31, 53 and 459", "23, 391 and 658", "All ten stores"], "correct": 0, "explain": "Stores 19, 28 and 215 have the Takis/Barcel endcap on the manifest."}, {"q": "What's the first thing you do before setting the Takis endcap?", "options": ["Order new strips", "Pull the Frito Lay endcap next to it", "Brief store management, since it's mapped to a planogram with UPCs", "Call the vendor to set it"], "correct": 2, "explain": "Brief store management first. Unlike the Frito Lay endcaps, the Takis endcap is mapped to a planogram, and most stores don't realize it."}, {"q": "What did the test store find on the Takis endcap?", "options": ["It was buried in not-on-set product and none of the new items were on site", "It was already set correctly", "It had been removed by the store", "It only needed new tags"], "correct": 0, "explain": "It was loaded with not-on-set product the vendor parked there, and none of the new product was on site. Clear it all first."}, {"q": "On split-sided Salty Snacks sets, what do you verify before setting product?", "options": ["That the endcaps are empty", "That the hotline is open", "That sub-categories haven't swapped sides of the aisle", "That the shelves are all the same height"], "correct": 2, "explain": "Sub-categories can swap sides on split-sided sets. Verify placement before you start setting."}, {"q": "How much did the Salty Snacks test store pull?", "options": ["1 cart of close-outs", "10 carts of overstock", "Nothing. The set was clean", "3 carts of close-outs and 4 carts of overstock"], "correct": 3, "explain": "Three carts of close-outs and four carts of overstock, mostly vendor product stashed behind product that didn't belong."}, {"q": "Which set gets done first thing as the fresh set?", "options": ["Fuel Kiosks", "Laundry Detergents", "Dressings & Dips", "Crackers"], "correct": 2, "explain": "Dressings & Dips is the fresh set this week, so it goes first thing."}, {"q": "In Dressings & Dips, where do Private Selection and the new items go?", "options": ["Private Selection to the top shelf, all new items on the bottom three shelves", "Private Selection to the bottom shelf, new items on top", "Both at eye level", "New items on an endcap"], "correct": 0, "explain": "Private Selection moves to the top shelf, and all new items go on the bottom three shelves."}, {"q": "How long can refrigerated or frozen product be out?", "options": ["10 minutes", "20 minutes", "45 minutes", "As long as the set takes"], "correct": 1, "explain": "20 minutes, max. That applies to Dressings & Dips and Frozen Premium Meals."}, {"q": "What happens on Laundry Detergents after we leave?", "options": ["The store resets it again", "Vestcom sends new strips", "P&G adds EVO educational fixtures on certain sizes, and we should expect store questions", "Nothing. The set is final"], "correct": 2, "explain": "P&G comes in after our reset to add EVO educational fixtures. That piece wasn't tested, so expect questions and tell me if anything looks off."}, {"q": "Laundry planogram names changed from department zero one to department zero three. What does that mean for you?", "options": ["It's a different set with new product", "It's the same set with a new label", "The set moves to the home side", "The set is canceled"], "correct": 1, "explain": "Same set, new label. Don't let the rename throw you."}, {"q": "On Crackers, what happens to Nabisco Premium saltines, oyster and minis?", "options": ["They stay. That removal is for other divisions", "They come out for Kellanova Zesta", "They move to a new endcap", "They go to the fuel center"], "correct": 0, "explain": "They stay in our sets. The removal applies to other divisions, not us."}, {"q": "Charcoal & Firelogs planograms now lead with what?", "options": ["Charcoal", "Lighter fluid", "Grill brushes", "Firelogs"], "correct": 3, "explain": "Seasonal changeover: the planograms now lead with firelogs instead of charcoal."}, {"q": "What's the rule on moving product between the store and the fuel center?", "options": ["Move it only if the fuel center asks", "We don't move it in either direction. Store management brings new product out, and the fuel center handles disco and backstock", "Move new product out, but not backstock", "Move it all on a cart at the end of the day"], "correct": 1, "explain": "We do not transport product between the store and the fuel center, either direction. Coordinate with store management and the fuel center."}, {"q": "What's coming the week after next that every store gets, and what starts arriving this week?", "options": ["A Stationery blitz; the strips arrive this week", "Meat pusher install; the pushers start arriving this week", "A Laundry reflow; the fixtures arrive this week", "Nothing new"], "correct": 1, "explain": "The meat pusher install hits every store in Period 10 Week 1, and the pushers start arriving this week. Keep them with your Kompass materials."}];
const PERIOD_WEEK = "P09W4";
const ENDPOINT = "https://script.google.com/macros/s/AKfycbzmcP_mKbuBt-pY1zMGhgrgOWae3uI72PreeTaQTHJDc1Uj4oGq424zRRsdZ8YKo8c1/exec";
const answers = new Array(QUESTIONS.length).fill(null);
let locked = false;

const quizBody = document.getElementById('quizBody');
QUESTIONS.forEach((q, qi) => {
  const card = document.createElement('div');
  card.className = 'qcard';
  card.innerHTML = `<div class="qnum">QUESTION ${qi+1} OF ${QUESTIONS.length}</div><div class="qtext">${q.q}</div>`;
  const optWrap = document.createElement('div');
  q.options.forEach((optText, oi) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.type = 'button';
    btn.textContent = String.fromCharCode(65+oi) + '.  ' + optText;
    btn.addEventListener('click', () => {
      if (locked) return;
      answers[qi] = oi;
      Array.from(optWrap.children).forEach(c => c.classList.remove('selected'));
      btn.classList.add('selected');
      updateProgress();
    });
    optWrap.appendChild(btn);
  });
  card.appendChild(optWrap);
  const fb = document.createElement('div');
  fb.className = 'feedback';
  fb.id = 'fb-' + qi;
  card.appendChild(fb);
  quizBody.appendChild(card);
});

const nameInput = document.getElementById('nameInput');
const submitBtn = document.getElementById('submitBtn');
const progressFill = document.getElementById('progressFill');
const progressLabel = document.getElementById('progressLabel');

function updateProgress() {
  const answered = answers.filter(a => a !== null).length;
  progressFill.style.width = (answered / QUESTIONS.length * 100) + '%';
  progressLabel.textContent = answered + ' / ' + QUESTIONS.length + ' answered';
  checkReady();
}
nameInput.addEventListener('input', checkReady);
function checkReady() {
  const allAnswered = answers.every(a => a !== null);
  const hasName = nameInput.value.trim().length > 0;
  submitBtn.disabled = !(allAnswered && hasName);
}

function verdictFor(score, outOf) {
  const pct = score / outOf;
  if (score === outOf) return "Perfect. You were paying attention.";
  if (pct >= 0.8) return "Solid. Review the ones you missed.";
  if (pct >= 0.6) return "Watch the presentation again \u2014 key details were missed.";
  return "Go back and rewatch the full presentation before your next shift.";
}

submitBtn.addEventListener('click', () => {
  if (locked) return;
  locked = true;
  submitBtn.disabled = true;

  let score = 0;
  const missed = [];
  QUESTIONS.forEach((q, qi) => {
    const card = quizBody.children[qi];
    const optWrap = card.querySelector('div:nth-child(3)');
    const buttons = Array.from(optWrap.children);
    buttons.forEach(b => b.disabled = true);
    const chosen = answers[qi];
    const fb = document.getElementById('fb-' + qi);
    if (chosen === q.correct) {
      score++;
      buttons[chosen].classList.add('correct');
      fb.className = 'feedback show right';
      fb.textContent = q.explain;
    } else {
      buttons[chosen].classList.add('wrong');
      buttons[q.correct].classList.add('correct');
      fb.className = 'feedback show miss';
      fb.textContent = q.explain;
      missed.push(qi+1);
    }
  });

  const overlay = document.getElementById('overlay');
  const spinner = document.getElementById('spinner');
  const syncMsg = document.getElementById('syncMsg');
  overlay.classList.remove('hidden');

  const payload = {
    timestamp: new Date().toISOString(),
    periodWeek: PERIOD_WEEK,
    name: nameInput.value.trim(),
    score: score,
    outOf: QUESTIONS.length,
    percent: Math.round(score / QUESTIONS.length * 100),
    missedQuestions: missed.join(', ')
  };

  let postFailed = false;
  try {
    fetch(ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(payload)
    }).catch(() => { postFailed = true; });
  } catch (e) { postFailed = true; }

  setTimeout(() => {
    spinner.style.display = 'none';
    syncMsg.style.color = '#16a34a';
    syncMsg.textContent = 'Your results have been submitted.';
    setTimeout(() => {
      overlay.classList.add('hidden');
      showResult(score, QUESTIONS.length, postFailed);
    }, 2000);
  }, 1500);
});

function showResult(score, outOf, postFailed) {
  const resultArea = document.getElementById('resultArea');
  let verdict = verdictFor(score, outOf);
  if (postFailed) verdict += ' Screenshot this and send it to me.';
  resultArea.innerHTML = `
    <div class="result-card">
      <div class="result-score">${score} / ${outOf}</div>
      <div class="result-verdict">${verdict}</div>
    </div>`;
  resultArea.scrollIntoView({behavior:'smooth'});
}
</script>
</body>
</html>
