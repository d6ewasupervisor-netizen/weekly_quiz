<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>P08W4 Quiz — District 8</title>
<style>
:root{
  --navy:#1B2A4A; --teal:#0891B2; --orange:#F59E0B; --red:#DC2626;
  --yellow:#FEF3C7; --lightblue:#ECFEFF; --green:#16A34A;
  --ink:#0F172A; --mute:#64748B; --line:#E2E8F0;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Carlito,Calibri,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#F1F5F9;color:var(--ink);line-height:1.5;-webkit-text-size-adjust:100%}
.shell{max-width:720px;margin:0 auto;background:#fff;min-height:100vh;
  box-shadow:0 0 40px rgba(15,23,42,.08)}
header{background:var(--navy);color:#fff;padding:26px 22px 22px;
  border-bottom:6px solid var(--teal);position:relative}
header .pw{font-size:13px;letter-spacing:4px;color:#67E8F9;font-weight:700;text-transform:uppercase}
header h1{font-size:26px;margin-top:6px;font-weight:700;line-height:1.2}
header p{font-size:15px;color:#BAE6FD;margin-top:8px}
.progwrap{height:8px;background:#334155}
.prog{height:100%;width:0;background:var(--orange);transition:width .25s ease}
.namebox{padding:22px 22px 6px}
.namebox label{display:block;font-size:14px;font-weight:700;color:var(--navy);
  letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px}
.namebox input{width:100%;padding:14px 16px;font-size:17px;font-family:inherit;
  border:3px solid var(--line);border-radius:10px;background:#fff}
.namebox input:focus{outline:none;border-color:var(--teal)}
.qlist{padding:16px 22px 0}
.q{border:3px solid var(--line);border-radius:14px;margin-bottom:18px;overflow:hidden}
.q .qh{background:var(--lightblue);padding:14px 18px;display:flex;gap:12px;align-items:flex-start}
.q .qn{background:var(--navy);color:#fff;font-size:14px;font-weight:700;min-width:30px;height:30px;
  border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none}
.q .qt{font-size:17px;font-weight:700;color:var(--navy)}
.opts{padding:12px 18px 16px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:2px solid var(--line);
  border-radius:10px;margin-bottom:9px;cursor:pointer;font-size:16px;background:#fff;
  transition:border-color .12s,background .12s}
.opt:last-child{margin-bottom:0}
.opt:active{background:#F8FAFC}
.opt.sel{border-color:var(--teal);background:var(--lightblue)}
.opt .k{font-weight:700;color:var(--teal);flex:none;min-width:18px}
.opt input{display:none}
.fb{display:none;margin:0 18px 16px;padding:13px 16px;border-radius:10px;font-size:15px;line-height:1.45}
.fb.show{display:block}
.fb.right{background:#DCFCE7;border-left:8px solid var(--green);color:#14532D}
.fb.wrong{background:var(--yellow);border-left:8px solid var(--red);color:#7F1D1D}
.fb b{display:block;margin-bottom:3px}
.graded .opt{cursor:default}
.graded .opt.correct{border-color:var(--green);background:#DCFCE7}
.graded .opt.picked-wrong{border-color:var(--red);background:#FEE2E2;text-decoration:line-through}
.submitwrap{padding:8px 22px 40px}
button#go{width:100%;padding:18px;font-size:19px;font-weight:700;font-family:inherit;
  letter-spacing:2px;text-transform:uppercase;border:0;border-radius:12px;
  background:var(--teal);color:#fff;cursor:pointer}
button#go:disabled{background:#CBD5E1;color:#64748B;cursor:not-allowed}
.result{display:none;margin:0 22px 30px;border-radius:14px;overflow:hidden;border:3px solid var(--navy)}
.result.show{display:block}
.result .top{background:var(--navy);color:#fff;padding:26px 22px;text-align:center}
.result .score{font-size:64px;font-weight:700;color:var(--orange);line-height:1}
.result .pct{font-size:17px;color:#BAE6FD;margin-top:6px;letter-spacing:2px}
.result .verdict{padding:20px 22px;font-size:17px;font-weight:700;color:var(--navy);
  background:var(--lightblue);text-align:center}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.92);display:none;
  align-items:center;justify-content:center;z-index:999;padding:24px}
.overlay.show{display:flex}
.overlay-box{background:#fff;border-radius:18px;padding:40px 34px;text-align:center;
  min-width:280px;max-width:340px;border-top:8px solid var(--teal)}
.spinner{width:54px;height:54px;margin:0 auto 20px;border:6px solid var(--line);
  border-top-color:var(--teal);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sync-msg{font-size:18px;font-weight:700;color:var(--navy);letter-spacing:1px}
.sync-msg.done{color:var(--green)}
footer{padding:0 22px 34px;font-size:13px;color:var(--mute);text-align:center}
</style>
</head>
<body>
<div class="shell">
  <header>
    <div class="pw">Period 08 &middot; Week 4</div>
    <h1>District 8 Reset Quiz</h1>
    <p>Twenty questions. Everything is in the recap.</p>
  </header>
  <div class="progwrap"><div class="prog" id="prog"></div></div>

  <div class="namebox">
    <label for="nm">Your name</label>
    <input id="nm" type="text" autocomplete="name" placeholder="First and last name">
  </div>

  <div class="qlist" id="qlist"></div>

  <div class="submitwrap">
    <button id="go" disabled>Submit</button>
  </div>

  <div class="result" id="result">
    <div class="top"><div class="score" id="sc">0 / 20</div><div class="pct" id="pc">0%</div></div>
    <div class="verdict" id="vd"></div>
  </div>

  <footer>Scores come straight to me.</footer>
</div>

<div class="overlay" id="ov">
  <div class="overlay-box">
    <div class="spinner" id="sp"></div>
    <div class="sync-msg" id="sm">Buffering...</div>
  </div>
</div>

<script>
const PERIOD_WEEK = "P08W4";
const ENDPOINT = "https://script.google.com/macros/s/AKfycbzmcP_mKbuBt-pY1zMGhgrgOWae3uI72PreeTaQTHJDc1Uj4oGq424zRRsdZ8YKo8c1/exec";

const QUESTIONS = [
{q:"Which set is the biggest single job on the board this week?",
 o:["Ready To Serve Soup at six hours","Yogurt at nine hours","Paper Housewares at six hours","Condensed Soup at six hours"],a:1,
 e:"Yogurt is nine hours on its own. Ready To Serve Soup, Paper Housewares, and Condensed Soup are six apiece."},

{q:"In Ready To Serve Soup, what comes off the shelf first in Bay 1?",
 o:["The Progresso Traditional","All the STO soups","All the Campbell's single serve","The microwavable bowls"],a:2,
 e:"Every Campbell's single serve gets pulled first because all of it is headed to the top shelf. Clearing it opens the bay for everything else."},

{q:"Where do all the microwavables end up in Ready To Serve Soup?",
 o:["The top shelf","The bottom shelf","Shelves five and six","They stay where they are"],a:0,
 e:"All microwavables move to the top shelf as part of the reflow."},

{q:"Where do the STO soups land in Ready To Serve Soup?",
 o:["Top shelf above the Progresso","Bottom shelf, horizontally blocked with the Pacific cans","Bay 1, leading the set","Split across shelves five and six"],a:1,
 e:"STO soups all come down to the bottom shelf and get horizontally blocked with the Pacific cans."},

{q:"Where does the Progresso and Campbell's protein block get built?",
 o:["Shelves 1 and 2, bays 1 and 2","Shelves 5 and 6, bays 3 and 4","Top shelf across all bays","Bottom shelf, bays 1 and 2"],a:1,
 e:"The protein block goes on shelves 5 and 6 in bays 3 and 4."},

{q:"What happens to the two Swanson sipping broth items this week?",
 o:["They get pulled as deletes and boxed for the store","They stay in the soup set until the broth reset","They come out of the soup set and get cut into the broth set now","They move to the dry ramen set"],a:2,
 e:"They come out of Ready To Serve Soup this week and get cut into the broth set immediately. They live there until the broth reset lands the following period-week."},

{q:"Your planogram shows Juanita's coming out of the soup set. What do you do?",
 o:["Pull it and box it as a delete","Verify the planogram first, because it is not discontinued","Leave it in the soup set and ignore the planogram","Move it to the front end coolers"],a:1,
 e:"Juanita's is not discontinued. Those items move to the dry ramen and authentic Hispanic sets. Verify before pulling anything."},

{q:"Which two District 8 stores are NOT adjacency stores on Paper Housewares?",
 o:["19 and 23","28 and 53","658 and 682","31 and 215"],a:1,
 e:"28 and 53 are standalone. Every other District 8 store runs the adjacency combination."},

{q:"At an adjacency store, which side of the planogram do napkins shift to?",
 o:["The left-hand side","The right-hand side","The center bay","They stay wherever they are today"],a:0,
 e:"Napkins shift to the left-hand side of the planogram no matter how the aisle is sequenced today."},

{q:"At a standalone Paper Housewares store, where do the foam cups go?",
 o:["Top shelf","Bottom shelf","Left side with Simple Truth","They are deleted"],a:1,
 e:"Standalone stores run a flow change: Simple Truth, Chinet, and Repurpose move to the left side, and foam cups drop to the bottom shelf."},

{q:"How are the Paper Housewares planograms being renamed?",
 o:["Department zero three to department zero one","Department zero one to department zero three","Department zero one to department zero seven","They are not being renamed"],a:1,
 e:"Planograms move from department zero one to department zero three. Work off the renamed version."},

{q:"What is the recommended working order on Paper Housewares?",
 o:["Cups first, then plates and bowls, then napkins","Plates and bowls first, then napkins, then cups","Napkins first, then cups, then plates and bowls","Whatever order the bay allows"],a:2,
 e:"Napkins first because that space shrinks and the cutlery and straws move in alongside them. Then all cups to the top shelf. Then plates and bowls."},

{q:"Where do you start on the Yogurt set?",
 o:["In the kids section, working toward Chobani","In the Chobani portion, working toward the kids section","At the natural end, working back","Anywhere, the set slides evenly"],a:1,
 e:"Start in the Chobani portion and work toward the kids section. That direction lets you pull product instead of pushing it."},

{q:"What is happening in the front end coolers with the Yogurt update?",
 o:["The coolers are being emptied and reset from scratch","Chobani Protein and Kroger Protein drinkables get dual placed there","All yogurt moves out of the coolers","Only the kids items go in the coolers"],a:1,
 e:"Chobani Protein and Kroger Protein drinkables get dual placed in the front end coolers on top of their home in the yogurt set."},

{q:"In Condensed Soup, which soups lead the set on the left after the reflow?",
 o:["The eating soups","The Kroger soups","The cooking soups, meaning broths and creams","The kids multi-packs"],a:2,
 e:"Cooking soups and eating soups swap places. The cooking soups lead the set on the left, and the eating soups move toward the Kroger soups."},

{q:"How do the health benefits get blocked in Condensed Soup?",
 o:["Horizontally","Vertically","Diagonally by shelf","They are not blocked"],a:0,
 e:"Health benefits block horizontally. Flavor profiles block vertically. Do not mix the two up."},

{q:"When does Bagged Salad get done?",
 o:["Last, after the heavy sets are finished","First thing, unless another priority has been called out","Whenever the store has staff available","Only on the second day"],a:1,
 e:"It is a produce set, so it goes first thing unless a different priority has been set for the week."},

{q:"Your Breakfast Sweets reset lands on a bakery table. Where does the new planogram go?",
 o:["Handed to the Bakery department","Taped to the front of the table","Inside the plastic sleeve attached to the table","Left in the Vestcom box"],a:2,
 e:"Bakery table resets get the new planogram inside the plastic sleeve attached to the table. Anything else, hand the printed planograms to Bakery."},

{q:"What is the maximum time refrigerated product can sit out of temp?",
 o:["Ten minutes","Twenty minutes","Thirty minutes","As long as the reset takes"],a:1,
 e:"Twenty minutes. Not once, not for a minute, not because the set was almost done."},

{q:"On the fuel sets, who moves product between the store and the fuel center?",
 o:["We do, in both directions","We bring product out, the fuel center sends nothing back","Store management brings new product out, the fuel center handles disco and backstock","Nobody moves product at all"],a:2,
 e:"We are not permitted to carry product between the store and the fuel center in either direction. Store management walks the new product out and the fuel center handles the discontinued items and backstock."}
];

const KEYS = ["A","B","C","D"];
const picks = {};
const list = document.getElementById("qlist");

QUESTIONS.forEach((item, i) => {
  const d = document.createElement("div");
  d.className = "q"; d.id = "q" + i;
  let html = '<div class="qh"><div class="qn">' + (i + 1) + '</div><div class="qt">'
    + item.q + '</div></div><div class="opts">';
  item.o.forEach((opt, j) => {
    html += '<label class="opt" data-q="' + i + '" data-o="' + j + '">'
      + '<span class="k">' + KEYS[j] + '</span><span class="tx">' + opt + '</span></label>';
  });
  html += '</div><div class="fb" id="fb' + i + '"></div>';
  d.innerHTML = html;
  list.appendChild(d);
});

let graded = false;

document.querySelectorAll(".opt").forEach(el => {
  el.addEventListener("click", () => {
    if (graded) return;
    const qi = +el.dataset.q, oi = +el.dataset.o;
    document.querySelectorAll('.opt[data-q="' + qi + '"]').forEach(s => s.classList.remove("sel"));
    el.classList.add("sel");
    picks[qi] = oi;
    refresh();
  });
});

document.getElementById("nm").addEventListener("input", refresh);

function refresh() {
  const done = Object.keys(picks).length;
  document.getElementById("prog").style.width = (done / QUESTIONS.length * 100) + "%";
  const named = document.getElementById("nm").value.trim().length > 1;
  document.getElementById("go").disabled = !(named && done === QUESTIONS.length) || graded;
}

function verdict(score) {
  if (score === 20) return "Perfect. You were paying attention.";
  if (score >= 16) return "Solid. Review the ones you missed before Monday.";
  if (score >= 12) return "Watch the recap again — you missed details that matter on the floor.";
  return "Go back and watch the full recap before your next shift.";
}

document.getElementById("go").addEventListener("click", () => {
  if (graded) return;
  graded = true;
  document.getElementById("go").disabled = true;

  let score = 0;
  const missed = [];

  QUESTIONS.forEach((item, i) => {
    const chosen = picks[i];
    const right = chosen === item.a;
    if (right) score++; else missed.push(i + 1);

    document.getElementById("q" + i).classList.add("graded");
    document.querySelectorAll('.opt[data-q="' + i + '"]').forEach(el => {
      const oi = +el.dataset.o;
      el.classList.remove("sel");
      if (oi === item.a) el.classList.add("correct");
      if (oi === chosen && !right) el.classList.add("picked-wrong");
    });

    const fb = document.getElementById("fb" + i);
    fb.className = "fb show " + (right ? "right" : "wrong");
    fb.innerHTML = "<b>" + (right ? "Correct." : "Not quite.") + "</b>" + item.e;
  });

  const pct = Math.round(score / QUESTIONS.length * 100);
  document.getElementById("sc").textContent = score + " / " + QUESTIONS.length;
  document.getElementById("pc").textContent = pct + "%";
  document.getElementById("vd").textContent = verdict(score);

  const ov = document.getElementById("ov");
  const sp = document.getElementById("sp");
  const sm = document.getElementById("sm");
  sp.style.display = "block";
  sm.className = "sync-msg";
  sm.textContent = "Buffering...";
  ov.classList.add("show");

  const payload = {
    timestamp: new Date().toISOString(),
    periodWeek: PERIOD_WEEK,
    name: document.getElementById("nm").value.trim(),
    score: score,
    outOf: QUESTIONS.length,
    percent: pct,
    missed: missed.join(", ")
  };

  fetch(ENDPOINT, {
    method: "POST",
    mode: "no-cors",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  }).catch(() => {});

  setTimeout(() => {
    sp.style.display = "none";
    sm.className = "sync-msg done";
    sm.textContent = "Your results have been submitted.";
    setTimeout(() => {
      ov.classList.remove("show");
      document.getElementById("result").classList.add("show");
      document.getElementById("result").scrollIntoView({ behavior: "smooth", block: "center" });
    }, 2000);
  }, 1500);
});

refresh();
</script>
</body>
</html>
