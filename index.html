<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>P08W1 Quiz &middot; District 8</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#1B2A4A;--teal:#0891B2;--orange:#F59E0B;--red:#DC2626;--green:#0F9D58;--bg:#F0F4F8;--yel:#FEF3C7;--lb:#ECFEFF}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--navy);line-height:1.5;padding-bottom:120px}
.bar{position:fixed;top:0;left:0;right:0;height:6px;background:#D6E0EC;z-index:60}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--orange));transition:width .3s}
header{background:var(--navy);color:#fff;padding:38px 20px 30px;text-align:center}
header .k{font-family:'Space Mono',monospace;font-size:12px;letter-spacing:3px;color:var(--teal);text-transform:uppercase}
header h1{font-size:30px;font-weight:700;margin:8px 0 6px}
header p{font-size:14px;color:#B6C6DE}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px}
.namebox{background:#fff;border-radius:14px;padding:18px;box-shadow:0 3px 12px rgba(27,42,74,.09);margin-bottom:22px}
.namebox label{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--teal);font-weight:700;display:block;margin-bottom:8px}
.namebox input{width:100%;font-family:'DM Sans',sans-serif;font-size:17px;padding:13px;border:2px solid #D6E0EC;border-radius:10px;outline:none}
.namebox input:focus{border-color:var(--teal)}
.q{background:#fff;border-radius:14px;padding:18px;box-shadow:0 3px 12px rgba(27,42,74,.09);margin-bottom:16px}
.qn{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:2px;color:var(--teal);font-weight:700;margin-bottom:8px}
.qt{font-size:17px;font-weight:500;margin-bottom:14px;line-height:1.4}
.opt{display:flex;gap:11px;align-items:flex-start;padding:12px 13px;border:2px solid #E2E9F2;border-radius:10px;margin-bottom:9px;cursor:pointer;font-size:15px;transition:.15s}
.opt:last-of-type{margin-bottom:0}
.opt:active{transform:scale(.99)}
.opt.sel{border-color:var(--teal);background:var(--lb)}
.opt .ltr{font-family:'Space Mono',monospace;font-weight:700;color:var(--teal);flex:none;width:17px}
.locked .opt{cursor:default}
.opt.ok{border-color:var(--green);background:#E9F7EF}
.opt.ok .ltr{color:var(--green)}
.opt.bad{border-color:var(--red);background:#FDECEC}
.opt.bad .ltr{color:var(--red)}
.opt.bad .tx{text-decoration:line-through;opacity:.65}
.fb{margin-top:12px;padding:12px 14px;border-radius:10px;font-size:14px;line-height:1.45}
.fb.ok{background:#E9F7EF;border-left:5px solid var(--green)}
.fb.bad{background:var(--yel);border-left:5px solid var(--red)}
.fb b{font-weight:700}
#submit{position:fixed;left:0;right:0;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:rgba(240,244,248,.96);backdrop-filter:blur(8px);border-top:1px solid #D6E0EC;z-index:50}
#submit button{display:block;width:100%;max-width:608px;margin:0 auto;font-family:'DM Sans',sans-serif;font-size:18px;font-weight:700;padding:16px;border:none;border-radius:12px;background:var(--teal);color:#fff;cursor:pointer}
#submit button:disabled{background:#B4C4D6;cursor:not-allowed}
#result{display:none;background:var(--navy);color:#fff;border-radius:16px;padding:28px 22px;text-align:center;margin-bottom:20px}
#result .score{font-family:'Space Mono',monospace;font-size:56px;font-weight:700;line-height:1}
#result .pct{font-size:19px;color:var(--teal);font-weight:700;margin-top:4px}
#result .verdict{font-size:16px;color:#D5E0EE;margin-top:14px;line-height:1.5}
.overlay{position:fixed;inset:0;background:rgba(27,42,74,.97);z-index:200;display:none;align-items:center;justify-content:center}
.overlay.on{display:flex}
.overlay-box{text-align:center;color:#fff;padding:30px}
.spinner{width:54px;height:54px;border:5px solid rgba(255,255,255,.2);border-top-color:var(--teal);border-radius:50%;margin:0 auto 20px;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.sync-msg{font-family:'Space Mono',monospace;font-size:16px;letter-spacing:2px}
.sync-msg.done{color:#4ADE80;font-weight:700}
footer{text-align:center;font-size:13px;color:#6B7F9B;padding:8px 20px 30px;line-height:1.5}
</style>
</head>
<body>
<div class="bar"><i id="pbar"></i></div>
<header>
  <div class="k">Period 8 &middot; Week 1 &middot; District 8</div>
  <h1>Weekly Check</h1>
  <p>20 questions &middot; about 5 minutes</p>
</header>

<div class="wrap">
  <div class="namebox">
    <label for="nm">Your name</label>
    <input id="nm" type="text" autocomplete="name" placeholder="First and last">
  </div>
  <div id="result"></div>
  <div id="qs"></div>
</div>

<div id="submit"><button id="btn" disabled>Answer all 20 questions</button></div>
<footer>Results come straight to me automatically.</footer>

<div class="overlay" id="ov"><div class="overlay-box">
  <div class="spinner" id="spin"></div>
  <div class="sync-msg" id="syncmsg">Buffering...</div>
</div></div>

<script>
const PERIOD_WEEK = "P08W1";
const ENDPOINT = "https://script.google.com/macros/s/AKfycbzmcP_mKbuBt-pY1zMGhgrgOWae3uI72PreeTaQTHJDc1Uj4oGq424zRRsdZ8YKo8c1/exec";

const Q = [
{q:"How many hours is Hand Body Face this week, and what makes it heavy?",
 o:["8 hours — a full reflow of the set","16 hours — heaviest add and delete activity, almost everything shifts","4 hours — only the acne block changes","12 hours — every shelf drops one notch"],a:1,
 e:"It's 16 hours. There's no reflow and no shelf moves — the weight comes from volume. Nearly every item on the set shifts, mostly side to side."},

{q:"Where does the Color Cosmetics crossover material arrive?",
 o:["In your main Vestcom box with everything else","In a separate Vestcom cosmetics box with a pink label","It ships directly to the store manager","It comes the following week"],a:1,
 e:"Separate Vestcom cosmetics box, pink label. It will not be in your main box, so find it before you start rather than after."},

{q:"On Hand Body Face, where does Starface go?",
 o:["In front of Hero Mighty Patch","At the far right end of the set","With the Korean Beauty block","On the bottom shelf"],a:0,
 e:"Starface goes in front of Hero Mighty Patch. Item order inside each brand is exact on this set — that's where it gets away from people."},

{q:"What should you stage before starting Hand Body Face?",
 o:["Extra shelf channels","Banana boxes for close-outs and extra pushers","A second Zebra","Replacement rail strips"],a:1,
 e:"The test store filled seven banana boxes with close-outs and needed five extra pushers. Stage them up front instead of hunting mid-set."},

{q:"On Pasta Sauce, which brand now leads the set?",
 o:["Ragu","Prego","Kroger","Rao's"],a:2,
 e:"Kroger leads, then Prego, then Ragu, blocking top to bottom."},

{q:"Where does Hunts canned sauce end up?",
 o:["It stays underneath alfredo","Opposite end of the planogram, under Kroger on the bottom shelf","Top shelf next to the premium block","It leaves the set entirely"],a:1,
 e:"Hunts moves from under alfredo all the way to the opposite end and sits under Kroger on the bottom shelf."},

{q:"Two of you are resetting Pasta Sauce. How do you start?",
 o:["Both start at the alfredo end","One on each end, meet in the middle","Both start in the middle and work outward","One resets while the other pulls close-outs"],a:1,
 e:"Two people start one on each end. Working alone, you start at the alfredo end and move toward the tomato end."},

{q:"On the tomato end of Pasta Sauce, what's the first move?",
 o:["Slide Ragu over, then pull the Kroger","Pull the Kroger, then slide Ragu and Prego over","Drop the shelf one notch first","Set the premium block first"],a:1,
 e:"Pull the Kroger first, then slide Ragu and Prego over. Doing it the other way boxes you in."},

{q:"Bay 5 top shelf on the Pasta Sauce test planogram doesn't fit. What do you do?",
 o:["Email the issue in and wait for a response","Cut one facing from an adjacent item so all three get one facing each","Leave the last two items off the set","Add a shelf to make room"],a:1,
 e:"Cut one facing from the adjacent item so the three sit with one facing each. It's already been reported — no email needed."},

{q:"Does Bagels and Cream Cheese have shelf adjustments?",
 o:["No — flow changes only","Yes — mostly vertical movement plus shelf height changes","Only at exception stores","Only where bagels are being removed"],a:1,
 e:"Yes. Movement is mostly vertical and there are a number of shelf height changes. Read the planogram before you start pulling."},

{q:"How long can a refrigerated or frozen set be out of temperature?",
 o:["10 minutes","20 minutes maximum","45 minutes","As long as it takes, if you work fast"],a:1,
 e:"20 minutes maximum. Work out of a cart, not off the floor, and pull in sections."},

{q:"Strip orders are sitting in your back room at 31, 53 or 459. What happens?",
 o:["Leave them — they'll be picked up next visit","Install them and tell me, so I can sign the events out","Send them back to the ordering store","Hold them until the category resets again"],a:1,
 e:"Install them and tell me. Those strips were ordered and delivered — the events can't come off my list until somebody puts them up."},

{q:"On C406 Cookies, what happens to branded rack strips like Biscoff?",
 o:["Pull them and replace with new strips","Leave them in place — they stay on the rack","Move them to the bottom shelf","Return them with the close-outs"],a:1,
 e:"Leave them in place. Branded rack strips stay on the rack when you update the set. Those aren't ours to pull."},

{q:"You've been assigned surveys. When and where do they get done?",
 o:["One survey for the district, due end of period","Starting Monday, one in every store you work","Only at stores with a reset that week","Whenever you get a spare shift"],a:1,
 e:"Starting Monday, one per store — in every store you work, not one for the district. Do it while you're standing in the building."},

{q:"What's changing about how you send feedback on the end-of-day app?",
 o:["A feedback hub goes live in the app next week — screenshot it and send it in the moment","Feedback moves to a monthly form","Only leads can submit feedback","Feedback is collected once a year"],a:0,
 e:"A feedback hub goes live in the app next week. Screenshot the problem and send it while it's fresh, instead of trying to remember it three days later."},

{q:"Which of these is a DO NOT INSTALL zone for digital shelf labels?",
 o:["Center store grocery","Narrow shelf strips in the spice aisle","Frozen, wine, tobacco and dump bins","Produce and meat"],a:2,
 e:"Frozen, wine, tobacco and dump bins are all off limits — along with fuel center, seasonal, gift cards, American Greetings, lobby, furniture, clip strips and floor displays."},

{q:"A digital tag covers another item's barcode. What do you do?",
 o:["Size down to the next smaller tag","Move the neighboring product","Angle the tag and move on","Skip the tag and note it on your EOD"],a:0,
 e:"Size down. That's the whole rule — if it covers another barcode, go smaller. The size you need is printed on the shelf strip."},

{q:"What's the correct digital shelf label install order?",
 o:["Tag, then channel, then planogram strip","Channel if needed, then planogram strip, then tag","Planogram strip, then tag, then channel","Tag first so you don't forget it"],a:1,
 e:"Channel into the rail if needed, then the planogram strip, then snap in the tag. Never install a tag before the planogram strip."},

{q:"It's mid-shift and the store still hasn't given you a Zebra. What now?",
 o:["Work the set and associate tags tomorrow","Keep asking the store until someone helps","Tell me so I can get it resolved — don't wait it out","Skip the digital tags for that set"],a:2,
 e:"Escalate to me. Ask the store first thing in the morning, and if you don't have one by mid-shift, don't burn the day waiting."},

{q:"Where do signoff photos go, and what's required in every EOD subject line?",
 o:["Emailed to the store manager; category number in the subject","Loaded into prod under Kompass Maintenance; store number in the subject","Texted to your lead; your name in the subject","Kept on your phone; period and week in the subject"],a:1,
 e:"Photos load into prod under Kompass Maintenance — in tight, in focus, in good light. And the store number goes in the subject line of every EOD, no exceptions."}
];

const qs = document.getElementById('qs'), btn = document.getElementById('btn'),
      bar = document.getElementById('pbar'), nm = document.getElementById('nm'),
      ov = document.getElementById('ov'), spin = document.getElementById('spin'),
      syncmsg = document.getElementById('syncmsg'), res = document.getElementById('result');
const picks = new Array(Q.length).fill(null);
let locked = false;
const L = ['A','B','C','D'];

Q.forEach((item, i) => {
  const d = document.createElement('div');
  d.className = 'q'; d.id = 'q' + i;
  d.innerHTML = '<div class="qn">Question ' + (i+1) + ' of ' + Q.length + '</div><div class="qt">' + item.q + '</div>' +
    item.o.map((o, j) => '<div class="opt" data-q="' + i + '" data-o="' + j + '"><span class="ltr">' + L[j] + '</span><span class="tx">' + o + '</span></div>').join('');
  qs.appendChild(d);
});

qs.addEventListener('click', e => {
  const el = e.target.closest('.opt');
  if (!el || locked) return;
  const qi = +el.dataset.q, oi = +el.dataset.o;
  document.querySelectorAll('[data-q="' + qi + '"]').forEach(x => x.classList.remove('sel'));
  el.classList.add('sel');
  picks[qi] = oi;
  refresh();
});
nm.addEventListener('input', refresh);

function refresh(){
  const done = picks.filter(p => p !== null).length;
  bar.style.width = (done / Q.length * 100) + '%';
  const ready = done === Q.length && nm.value.trim().length > 1;
  btn.disabled = !ready;
  btn.textContent = ready ? 'Submit answers' :
    (done < Q.length ? (Q.length - done) + ' question' + (Q.length - done === 1 ? '' : 's') + ' left' : 'Enter your name');
}

btn.addEventListener('click', () => {
  if (btn.disabled || locked) return;
  locked = true; btn.disabled = true;
  ov.classList.add('on');
  setTimeout(() => { spin.style.display = 'none'; syncmsg.textContent = 'Your results have been submitted.'; syncmsg.classList.add('done'); }, 1500);
  setTimeout(() => { ov.classList.remove('on'); grade(); }, 3500);
});

function grade(){
  let score = 0; const missed = [];
  Q.forEach((item, i) => {
    const box = document.getElementById('q' + i);
    box.classList.add('locked');
    const opts = box.querySelectorAll('.opt');
    const right = picks[i] === item.a;
    if (right) score++; else missed.push(i + 1);
    opts.forEach((el, j) => {
      el.classList.remove('sel');
      if (j === item.a) el.classList.add('ok');
      else if (j === picks[i]) el.classList.add('bad');
    });
    const fb = document.createElement('div');
    fb.className = 'fb ' + (right ? 'ok' : 'bad');
    fb.innerHTML = (right ? '<b>Correct.</b> ' : '<b>Not quite.</b> ') + item.e;
    box.appendChild(fb);
  });

  const pct = Math.round(score / Q.length * 100);
  let verdict;
  if (score === 20) verdict = "Perfect. You were paying attention.";
  else if (score >= 18) verdict = "Solid. Look over the ones you missed before your first shift.";
  else if (score >= 14) verdict = "Some key details slipped through. Scroll back and read the ones you missed.";
  else verdict = "Go back through the full briefing before your next shift.";

  res.style.display = 'block';
  res.innerHTML = '<div class="score">' + score + '/' + Q.length + '</div><div class="pct">' + pct + '%</div>' +
    '<div class="verdict">' + verdict + '</div>';
  res.scrollIntoView({behavior:'smooth', block:'center'});
  btn.textContent = 'Submitted — ' + score + '/' + Q.length;

  post({
    timestamp: new Date().toISOString(),
    periodWeek: PERIOD_WEEK,
    name: nm.value.trim(),
    score: score,
    outOf: Q.length,
    percent: pct,
    missedQuestions: missed.join(', ')
  });
}

function post(payload){
  try {
    fetch(ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    }).catch(() => {});
  } catch(e){}
}

refresh();
</script>
</body>
</html>
