<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>District 8 Weekly Quiz &mdash; P10W1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:#1B2A4A; --teal:#0891B2; --orange:#F59E0B; --red:#DC2626;
    --lightyellow:#FEF3C7; --lightblue:#ECFEFF; --bg:#F0F4F8;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--navy); padding-bottom:60px; }
  header { background:var(--navy); color:#fff; padding:28px 20px 22px; text-align:center; }
  header .kicker { font-family:'Space Mono',monospace; color:#7dd3e0; letter-spacing:2px; font-size:13px; text-transform:uppercase; }
  header h1 { margin:8px 0 0; font-size:26px; }
  .progress-wrap { max-width:640px; margin:18px auto 0; padding:0 16px; }
  .progress-bar { background:#dde6ee; border-radius:999px; height:10px; overflow:hidden; }
  .progress-fill { background:linear-gradient(90deg,var(--teal),var(--orange)); height:100%; width:0%; transition:width .25s ease; }
  .progress-label { font-family:'Space Mono',monospace; font-size:12px; color:#46607a; margin-top:6px; text-align:right; }
  main { max-width:640px; margin:0 auto; padding:16px; }
  .name-card { background:#fff; border-radius:16px; padding:18px 20px; box-shadow:0 6px 18px rgba(27,42,74,.08); margin-bottom:20px; }
  .name-card label { font-weight:700; font-size:14px; display:block; margin-bottom:8px; }
  .name-card input { width:100%; padding:12px 14px; border-radius:10px; border:2px solid #dde6ee; font-size:16px; font-family:'DM Sans',sans-serif; }
  .name-card input:focus { outline:none; border-color:var(--teal); }
  .qcard { background:#fff; border-radius:16px; padding:20px; margin-bottom:16px; box-shadow:0 6px 18px rgba(27,42,74,.08); }
  .qnum { font-family:'Space Mono',monospace; color:var(--teal); font-size:12px; font-weight:700; letter-spacing:1px; }
  .qtext { font-weight:700; font-size:17px; margin:6px 0 14px; line-height:1.4; }
  .opt { display:block; width:100%; text-align:left; padding:12px 14px; margin-bottom:10px; border-radius:10px; border:2px solid #dde6ee; background:#fbfdff; font-size:15px; font-family:'DM Sans',sans-serif; cursor:pointer; transition:all .15s ease; }
  .opt:hover { border-color:var(--teal); }
  .opt.selected { border-color:var(--navy); background:#eef3f8; font-weight:700; }
  .opt.correct { background:#dcfce7; border-color:#16a34a; font-weight:700; }
  .opt.wrong { background:#fee2e2; border-color:var(--red); text-decoration:line-through; }
  .feedback { margin-top:10px; padding:12px 14px; border-radius:10px; font-size:14px; line-height:1.5; display:none; }
  .feedback.show { display:block; }
  .feedback.right { background:var(--lightblue); color:#0e5a6b; }
  .feedback.miss { background:var(--lightyellow); color:#92400e; }
  #submitBtn { width:100%; padding:16px; border:none; border-radius:12px; background:var(--navy); color:#fff; font-size:17px; font-weight:700; font-family:'DM Sans',sans-serif; cursor:pointer; margin-top:10px; }
  #submitBtn:disabled { background:#a9bcce; cursor:not-allowed; }
  .result-card { background:var(--navy); color:#fff; border-radius:16px; padding:26px 22px; text-align:center; margin-bottom:20px; }
  .result-score { font-family:'Space Mono',monospace; font-size:42px; font-weight:700; color:var(--orange); }
  .result-verdict { font-size:17px; margin-top:8px; }
  .overlay { position:fixed; inset:0; background:rgba(27,42,74,.92); display:flex; align-items:center; justify-content:center; z-index:999; }
  .overlay-box { background:#fff; border-radius:18px; padding:40px 36px; text-align:center; min-width:240px; }
  .spinner { width:44px; height:44px; border:5px solid #dde6ee; border-top-color:var(--teal); border-radius:50%; margin:0 auto 18px; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .sync-msg { font-weight:700; color:var(--navy); font-size:16px; }
  .hidden { display:none; }
</style>
</head>
<body>
<header>
  <div class="kicker">District 8 &middot; Weekly Check</div>
  <h1>P10W1 Quiz</h1>
</header>
<div class="progress-wrap">
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-label" id="progressLabel">0 / 20 answered</div>
</div>
<main>
  <div class="name-card">
    <label for="nameInput">Your name</label>
    <input type="text" id="nameInput" placeholder="Type your name" autocomplete="off">
  </div>
  <div id="quizBody"></div>
  <button id="submitBtn" disabled>Submit Quiz</button>
  <div id="resultArea"></div>
</main>

<div class="overlay hidden" id="overlay">
  <div class="overlay-box">
    <div class="spinner" id="spinner"></div>
    <div class="sync-msg" id="syncMsg">Buffering...</div>
  </div>
</div>

<script>
const QUESTIONS = [{"q": "How many hours are on the books this week, and how do they break down?", "options": ["62 hours: 37 Kompass plus the 25-hour Checklane Blitz", "37 hours total, blitz included", "62 hours of Kompass, with the blitz on top of that", "25 hours of Kompass plus a 37-hour blitz"], "correct": 0, "explain": "62 total: 37 hours of Kompass and the 25-hour Checklane Blitz stacked on top."}, {"q": "You start a check stand and can't finish it that day. What happens?", "options": ["You leave it and note it on the signoff form", "The store finishes it after you leave", "You go back the next day and finish it", "It waits for your next scheduled visit, even if that's next week"], "correct": 2, "explain": "Check stands are 100% complete the same day they're started. If not, the team goes back the next day. Never let one sit for days or roll into next week."}, {"q": "What's the fixture change on the Liberty snack endcaps?", "options": ["Swap it for a Hispanic snack endcap", "Add a shelf to fit the new meat snacks", "Pull one shelf. Seven shelves become six for height restrictions", "Remove the magazine holders"], "correct": 2, "explain": "One shelf comes off the seven-shelf Liberty snack endcap so it meets height restrictions."}, {"q": "What happens to the Apple accessories fixture?", "options": ["It stays put and picks up the new Apple items", "It comes out, and its items move to the KPF side panel, replacing the current HBC items", "It moves to the candy wing of the snack endcap", "The whole fixture moves to the KPF side panel, items and all"], "correct": 1, "explain": "The fixture comes out. Its items relocate to the Kroger Personal Finance side panel, replacing the Health Beauty Care items there now."}, {"q": "On the U-scans, which registers update?", "options": ["Only the middle registers: versions 70 and 73", "All four versions: 70, 73, 80 and 81", "Only versions 80 and 81", "Only the far-left and far-right ends"], "correct": 0, "explain": "Only the middle registers, versions 70 and 73, update. Versions 80 and 81 get no new POG and no materials."}, {"q": "You find no materials for U-scan versions 80 and 81. What do you do?", "options": ["Nothing is wrong. Don't report them as not in store, and confirm the middle registers are set before you sign out", "Leave the whole U-scan set for next week and note it on the signoff", "Set 80 and 81 to the new layout using the 70 and 73 materials", "Report 80 and 81 as not in store so the materials get reordered"], "correct": 0, "explain": "That's expected: 80 and 81 didn't update. Past rounds got wrongly reported as not in store. Confirm 70 and 73 are set before signing out."}, {"q": "On U-scan versions 70 and 73, what happens to the top shelf?", "options": ["Pringles move to the top shelf", "Nothing changes on the top shelf", "Candy comes out, and chips go in", "Chips and nuts come out, and candy goes in"], "correct": 3, "explain": "Top shelf: chips and nuts come out, candy goes in. The side shelves pick up Pringles and Pepperidge Farm."}, {"q": "Your checklane tags are missing or wrong. What's the plan?", "options": ["Leave the new items untagged until the store reorders", "Reuse current tags where they still match, and ask the store to scan the strips to print the new ones", "Handwrite every new tag before you sign out the set", "Hold the whole set until the corrected tags arrive"], "correct": 1, "explain": "The test store got almost none of the right tags. Reuse what still matches, and have the store scan the strips to print the rest."}, {"q": "How many banana boxes should you plan for off the checklanes?", "options": ["About 6 total, all of it overstock from facing reductions", "About a dozen: roughly 6 of overstock and 6 of close-out or not-on-set product", "About 25, roughly one box per blitz hour", "About 2, since the test store was clean going in"], "correct": 1, "explain": "The test store pulled 6 banana boxes of overstock (mostly candy facing reductions) and 6 of close-out and not-on-set product. Counts will vary by store."}, {"q": "Where's the heavy movement on the merch walls?", "options": ["Bays 1 and 2 on the outside wall change the most", "Pegged candy gets a full reset on every bay", "There's no real movement anywhere on the merch walls", "The inside wall: bays 4 and 5 change a lot, and only the bay 4 top shelf stays"], "correct": 3, "explain": "Bays 4 and 5 on the inside wall change a lot. Only the top shelf of bay 4 stays. Pegged candy doesn't change."}, {"q": "On the snack endcap front, what replaces Good Warrior meat sticks?", "options": ["Jack Link's", "Old Wisconsin meat snacks", "Chomps", "Archer meat sticks"], "correct": 3, "explain": "Archer replaces Good Warrior. Chomps and Jack Link's move up, and Old Wisconsin goes on the bottom."}, {"q": "What's happening on Packaged Lettuce?", "options": ["80 Acres shut down, so every 80 Acres item comes out", "80 Acres moves into Processed Produce", "Simple Truth items are replaced by 80 Acres", "80 Acres expands into more facings"], "correct": 0, "explain": "80 Acres closed down. All their items come out of Packaged Lettuce. Work the delete list."}, {"q": "You get Mushroom strips this week. Which set do you record them under?", "options": ["Processed Produce", "Cold Meal Solutions", "Produce Nuts", "Packaged Lettuce"], "correct": 0, "explain": "Mushroom strips ride with Processed Produce and get recorded there. The 20-minute rule applies to the mushrooms."}, {"q": "What's the action item before you pull milk facings on Fluid Milk or NF Milk?", "options": ["Pull all white gallons before starting", "Move the eggnog to an endcap", "Loop in dairy first", "Wait for the vendor"], "correct": 2, "explain": "Stores can be touchy about milk space. Loop in dairy before you pull facings."}, {"q": "What leads the Frozen Desserts set after the reflow?", "options": ["Edwards multiserve pies", "Whipped toppings", "A new fruit door: Tru Fru, Kroger and Fruit Riot", "The cheesecake destination"], "correct": 2, "explain": "A new fruit door leads the set. The cheesecake destination comes right after it."}, {"q": "Oreo and Chips Ahoy Fresh Stacks come out of Cookies. What do you do with the space?", "options": ["Move Kroger Maple Creme into it", "Face the adjacent product over to hold the space for future items", "Fill it with Ghirardelli", "Leave it empty with a hole tag"], "correct": 1, "explain": "Face adjacent product over to preserve the space for future additions. Ghirardelli goes in the premium cookie section."}, {"q": "What's the status of meat pushers this week?", "options": ["Install them wherever the meat department asks", "Install them at every store this week, as planned", "On hold. Don't start installs until I give the green light", "Install grid pushers only and hold the bunkers"], "correct": 2, "explain": "Meat pushers are on hold while grid pushers vs. meat department vs. bunkers gets clarified. Kompass and backlog come first."}, {"q": "What's on the books at Store 215 this week?", "options": ["A remodel kickoff, with all Kompass sets held until February", "The relay window starts 10/12 (treat Kompass sets as NIIs) and the Center Store 2nd count is Tuesday 10/13", "A home side count on Monday 10/12 and nothing else", "Nothing store-specific; it runs like every other store"], "correct": 1, "explain": "215's relay window runs 10/12 to 10/22, so treat Kompass sets as NIIs and work with the relay manager. The Center Store 2nd count is Tuesday 10/13."}, {"q": "Period 10 Week 2: a store has Home Testing items but no Diabetic set. Where do those items go?", "options": ["Onto the Vitamins set", "On a clip strip by the pharmacy", "Back to the warehouse", "Behind the Pharmacy counter"], "correct": 3, "explain": "Home Testing moves into the Diabetic sets. Without a Diabetic set, those items go behind the Pharmacy counter."}, {"q": "Which District 8 stores need 6 extra pegs on hand for Personal Care Appliances in Period 10 Week 3?", "options": ["658 and 682", "All ten District 8 stores", "19, 31, 53 and 459", "23, 28, 215 and 391"], "correct": 3, "explain": "Stores 23, 28, 215 and 391 are on the 8-foot set that needs 6 extra pegs. Start finding them now."}];
const PERIOD_WEEK = "P10W1";
const ENDPOINT = "https://script.google.com/macros/s/AKfycbzmcP_mKbuBt-pY1zMGhgrgOWae3uI72PreeTaQTHJDc1Uj4oGq424zRRsdZ8YKo8c1/exec";
const answers = new Array(QUESTIONS.length).fill(null);
let locked = false;

const quizBody = document.getElementById('quizBody');
QUESTIONS.forEach((q, qi) => {
  const card = document.createElement('div');
  card.className = 'qcard';
  card.innerHTML = `<div class="qnum">QUESTION ${qi+1} OF ${QUESTIONS.length}</div><div class="qtext">${q.q}</div>`;
  const optWrap = document.createElement('div');
  q.options.forEach((optText, oi) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.type = 'button';
    btn.textContent = String.fromCharCode(65+oi) + '.  ' + optText;
    btn.addEventListener('click', () => {
      if (locked) return;
      answers[qi] = oi;
      Array.from(optWrap.children).forEach(c => c.classList.remove('selected'));
      btn.classList.add('selected');
      updateProgress();
    });
    optWrap.appendChild(btn);
  });
  card.appendChild(optWrap);
  const fb = document.createElement('div');
  fb.className = 'feedback';
  fb.id = 'fb-' + qi;
  card.appendChild(fb);
  quizBody.appendChild(card);
});

const nameInput = document.getElementById('nameInput');
const submitBtn = document.getElementById('submitBtn');
const progressFill = document.getElementById('progressFill');
const progressLabel = document.getElementById('progressLabel');

function updateProgress() {
  const answered = answers.filter(a => a !== null).length;
  progressFill.style.width = (answered / QUESTIONS.length * 100) + '%';
  progressLabel.textContent = answered + ' / ' + QUESTIONS.length + ' answered';
  checkReady();
}
nameInput.addEventListener('input', checkReady);
function checkReady() {
  const allAnswered = answers.every(a => a !== null);
  const hasName = nameInput.value.trim().length > 0;
  submitBtn.disabled = !(allAnswered && hasName);
}

function verdictFor(score, outOf) {
  const pct = score / outOf;
  if (score === outOf) return "Perfect. You were paying attention.";
  if (pct >= 0.8) return "Solid. Review the ones you missed.";
  if (pct >= 0.6) return "Watch the presentation again \u2014 key details were missed.";
  return "Go back and rewatch the full presentation before your next shift.";
}

submitBtn.addEventListener('click', () => {
  if (locked) return;
  locked = true;
  submitBtn.disabled = true;

  let score = 0;
  const missed = [];
  QUESTIONS.forEach((q, qi) => {
    const card = quizBody.children[qi];
    const optWrap = card.querySelector('div:nth-child(3)');
    const buttons = Array.from(optWrap.children);
    buttons.forEach(b => b.disabled = true);
    const chosen = answers[qi];
    const fb = document.getElementById('fb-' + qi);
    if (chosen === q.correct) {
      score++;
      buttons[chosen].classList.add('correct');
      fb.className = 'feedback show right';
      fb.textContent = q.explain;
    } else {
      buttons[chosen].classList.add('wrong');
      buttons[q.correct].classList.add('correct');
      fb.className = 'feedback show miss';
      fb.textContent = q.explain;
      missed.push(qi+1);
    }
  });

  const overlay = document.getElementById('overlay');
  const spinner = document.getElementById('spinner');
  const syncMsg = document.getElementById('syncMsg');
  overlay.classList.remove('hidden');

  const payload = {
    timestamp: new Date().toISOString(),
    periodWeek: PERIOD_WEEK,
    name: nameInput.value.trim(),
    score: score,
    outOf: QUESTIONS.length,
    percent: Math.round(score / QUESTIONS.length * 100),
    missedQuestions: missed.join(', ')
  };

  let postFailed = false;
  try {
    fetch(ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(payload)
    }).catch(() => { postFailed = true; });
  } catch (e) { postFailed = true; }

  setTimeout(() => {
    spinner.style.display = 'none';
    syncMsg.style.color = '#16a34a';
    syncMsg.textContent = 'Your results have been submitted.';
    setTimeout(() => {
      overlay.classList.add('hidden');
      showResult(score, QUESTIONS.length, postFailed);
    }, 2000);
  }, 1500);
});

function showResult(score, outOf, postFailed) {
  const resultArea = document.getElementById('resultArea');
  let verdict = verdictFor(score, outOf);
  if (postFailed) verdict += ' Screenshot this and send it to me.';
  resultArea.innerHTML = `
    <div class="result-card">
      <div class="result-score">${score} / ${outOf}</div>
      <div class="result-verdict">${verdict}</div>
    </div>`;
  resultArea.scrollIntoView({behavior:'smooth'});
}
</script>
</body>
</html>
