<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>District 8 Weekly Quiz &mdash; P09W2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:#1B2A4A; --teal:#0891B2; --orange:#F59E0B; --red:#DC2626;
    --lightyellow:#FEF3C7; --lightblue:#ECFEFF; --bg:#F0F4F8;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--navy); padding-bottom:60px; }
  header { background:var(--navy); color:#fff; padding:28px 20px 22px; text-align:center; }
  header .kicker { font-family:'Space Mono',monospace; color:#7dd3e0; letter-spacing:2px; font-size:13px; text-transform:uppercase; }
  header h1 { margin:8px 0 0; font-size:26px; }
  .progress-wrap { max-width:640px; margin:18px auto 0; padding:0 16px; }
  .progress-bar { background:#dde6ee; border-radius:999px; height:10px; overflow:hidden; }
  .progress-fill { background:linear-gradient(90deg,var(--teal),var(--orange)); height:100%; width:0%; transition:width .25s ease; }
  .progress-label { font-family:'Space Mono',monospace; font-size:12px; color:#46607a; margin-top:6px; text-align:right; }
  main { max-width:640px; margin:0 auto; padding:16px; }
  .name-card { background:#fff; border-radius:16px; padding:18px 20px; box-shadow:0 6px 18px rgba(27,42,74,.08); margin-bottom:20px; }
  .name-card label { font-weight:700; font-size:14px; display:block; margin-bottom:8px; }
  .name-card input { width:100%; padding:12px 14px; border-radius:10px; border:2px solid #dde6ee; font-size:16px; font-family:'DM Sans',sans-serif; }
  .name-card input:focus { outline:none; border-color:var(--teal); }
  .qcard { background:#fff; border-radius:16px; padding:20px; margin-bottom:16px; box-shadow:0 6px 18px rgba(27,42,74,.08); }
  .qnum { font-family:'Space Mono',monospace; color:var(--teal); font-size:12px; font-weight:700; letter-spacing:1px; }
  .qtext { font-weight:700; font-size:17px; margin:6px 0 14px; line-height:1.4; }
  .opt { display:block; width:100%; text-align:left; padding:12px 14px; margin-bottom:10px; border-radius:10px; border:2px solid #dde6ee; background:#fbfdff; font-size:15px; font-family:'DM Sans',sans-serif; cursor:pointer; transition:all .15s ease; }
  .opt:hover { border-color:var(--teal); }
  .opt.selected { border-color:var(--navy); background:#eef3f8; font-weight:700; }
  .opt.correct { background:#dcfce7; border-color:#16a34a; font-weight:700; }
  .opt.wrong { background:#fee2e2; border-color:var(--red); text-decoration:line-through; }
  .feedback { margin-top:10px; padding:12px 14px; border-radius:10px; font-size:14px; line-height:1.5; display:none; }
  .feedback.show { display:block; }
  .feedback.right { background:var(--lightblue); color:#0e5a6b; }
  .feedback.miss { background:var(--lightyellow); color:#92400e; }
  #submitBtn { width:100%; padding:16px; border:none; border-radius:12px; background:var(--navy); color:#fff; font-size:17px; font-weight:700; font-family:'DM Sans',sans-serif; cursor:pointer; margin-top:10px; }
  #submitBtn:disabled { background:#a9bcce; cursor:not-allowed; }
  .result-card { background:var(--navy); color:#fff; border-radius:16px; padding:26px 22px; text-align:center; margin-bottom:20px; }
  .result-score { font-family:'Space Mono',monospace; font-size:42px; font-weight:700; color:var(--orange); }
  .result-verdict { font-size:17px; margin-top:8px; }
  .overlay { position:fixed; inset:0; background:rgba(27,42,74,.92); display:flex; align-items:center; justify-content:center; z-index:999; }
  .overlay-box { background:#fff; border-radius:18px; padding:40px 36px; text-align:center; min-width:240px; }
  .spinner { width:44px; height:44px; border:5px solid #dde6ee; border-top-color:var(--teal); border-radius:50%; margin:0 auto 18px; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .sync-msg { font-weight:700; color:var(--navy); font-size:16px; }
  .hidden { display:none; }
</style>
</head>
<body>
<header>
  <div class="kicker">District 8 &middot; Weekly Check</div>
  <h1>P09W2 Quiz</h1>
</header>
<div class="progress-wrap">
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-label" id="progressLabel">0 / 20 answered</div>
</div>
<main>
  <div class="name-card">
    <label for="nameInput">Your name</label>
    <input type="text" id="nameInput" placeholder="Type your name" autocomplete="off">
  </div>
  <div id="quizBody"></div>
  <button id="submitBtn" disabled>Submit Quiz</button>
  <div id="resultArea"></div>
</main>

<div class="overlay hidden" id="overlay">
  <div class="overlay-box">
    <div class="spinner" id="spinner"></div>
    <div class="sync-msg" id="syncMsg">Buffering...</div>
  </div>
</div>

<script>
const QUESTIONS = [{"q": "Both Boar\u2019s Head removal sets have hard finish dates already committed to Kroger. Which pair is correct?", "options": ["Store 215 Tuesday 9/22, Store 459 Thursday 9/24", "Store 215 Monday 9/21, Store 459 Wednesday 9/23", "Store 459 Tuesday 9/22, Store 215 Thursday 9/24", "Both stores set Friday 9/25"], "correct": 0, "explain": "Store 215 (Kent) is set for Tuesday, September 22, and store 459 (Renton) is set for Thursday, September 24 \u2014 both already committed to Kroger as completion dates."}, {"q": "At store 215, one section of the Boar\u2019s Head layout goes on hold this visit. Why?", "options": ["The store refused the placement", "It was never mapped, so no strips exist for it", "The fixture arrived damaged", "It's a test-only section"], "correct": 1, "explain": "The salsa/guac run at store 215 was never mapped, so there are no strips for it \u2014 leave the space open until a follow-up visit."}, {"q": "At the Boar\u2019s Head sets, what happens to Boar\u2019s Head\u2019s own branded fixtures and racks?", "options": ["We break them down for disposal", "We leave them in place for Boar\u2019s Head\u2019s team to collect", "We ship them back to Boar\u2019s Head ourselves", "We repurpose them for the new set"], "correct": 1, "explain": "We only pull product, strips, and tags \u2014 Boar\u2019s Head owns their fixtures and racks, so those stay in place for their own team to collect."}, {"q": "If either Boar\u2019s Head set date has to move, what's the expectation?", "options": ["Let me know at the next weekly meeting", "No need to report it, dates are flexible", "Get it to me the same day so it can be passed up", "Email Kroger directly"], "correct": 2, "explain": "The dates were sent to Kroger as our completion commitment, so any slip needs to reach me the same day it happens."}, {"q": "On Cocktail Mixers this week, what has to be on site before the set can start?", "options": ["New strips only", "The extra shelves for each bay", "A signed byway", "A Relay Manager walkthrough"], "correct": 1, "explain": "We\u2019re adding an extra shelf to every bay across the soda and cocktail sets \u2014 those shelves must be on site before the update can begin."}, {"q": "What should you do if a store can\u2019t locate its Mixer shelves?", "options": ["Skip the set entirely", "Pull the delivery signer\u2019s name and have the store search again", "Borrow shelves from another commodity", "Order replacements immediately"], "correct": 1, "explain": "Pull the FedEx/SIA signer\u2019s name from the tracking file and push the store to search again before treating it as a shortage."}, {"q": "What should you check for while resetting Gravy & Dry Mixes?", "options": ["Missing UPC labels", "Expired product", "Correct planogram version only", "Vendor invoices"], "correct": 1, "explain": "The test store pulled two full boxes of expired product out of this set \u2014 verify dates as you reset, don\u2019t assume the shelf is clean."}, {"q": "In the new Gravy & Dry Mixes layout, where do the wet gravies (jars, cans, pouches) go?", "options": ["Top shelf", "Bottom two shelves", "Upper left of the set", "They\u2019re deleted from the set"], "correct": 1, "explain": "All wet gravies drop to the bottom two shelves; dry gravies move to the upper left, with taco and chili seasonings on the upper right."}, {"q": "What\u2019s the rule for product during the Frozen Handheld Snacks reset?", "options": ["Can sit out up to an hour", "Cannot be out of the case longer than 20 minutes", "No time restriction", "Must be refrozen before resetting"], "correct": 1, "explain": "This is a refrigerated/frozen set \u2014 product cannot be left out of the case longer than 20 minutes."}, {"q": "For stores integrating natural into the regular Frozen Handheld set, what removes two shelves?", "options": ["Each existing natural door", "The regular set end caps", "The frozen dessert section", "Nothing is removed"], "correct": 0, "explain": "Integrated stores pull two shelves from each of the current natural doors as part of the full reflow."}, {"q": "On Brooms & Mops, which item relocates to a different section entirely?", "options": ["A broom handle display", "The dish puff item moves into Sponge", "Mop refill heads move into Laundry", "Nothing relocates this update"], "correct": 1, "explain": "The dish puff item moves out of Mops & Brooms and into the Sponge section on the new planogram \u2014 pull it from the old spot and reset it there."}, {"q": "Which three stores are converting Quick Clean from community to mainstream planograms this week?", "options": ["19, 23, 53", "28, 391, 459", "31, 215, 682", "658, 682, 391"], "correct": 1, "explain": "Stores 28, 391, and 459 are converting this week, with P&G shipping extra peg duster arms directly to those three stores."}, {"q": "Besides the standard Baking Mixes reset, what else ships alongside it this week?", "options": ["Nothing extra", "Holiday pallet tag sets", "A new fixture", "A vendor survey"], "correct": 1, "explain": "Stores are also receiving tag sets for holiday pallets \u2014 install those tags alongside the reset."}, {"q": "Which store gets a shelf-height and assortment adjustment in bay 1 on Baking Mixes?", "options": ["215", "391", "459", "682"], "correct": 2, "explain": "Store 459 has a shelf-height and assortment change in bay 1 that needs to be worked to the updated plan."}, {"q": "Why is Commercial Bread worth coordinating with the receiver and bread vendors?", "options": ["To get a discount", "So we can run it first and stay out of their way", "Because it requires vendor tools", "It doesn\u2019t need coordination"], "correct": 1, "explain": "Coordinating lets us complete the set first, ahead of the receiver and bread vendors' own deliveries."}, {"q": "What's the timekeeping rule being enforced this week?", "options": ["Leads clock the whole crew in at once", "Everyone clocks themselves in and out with their own 4-digit PIN", "Time is tracked by the store manager", "No PIN required for anyone"], "correct": 1, "explain": "Everyone self-clocks with their own PIN; leads do not clock teammates in or out. InstaWork reps clock through their own app instead."}, {"q": "Why do strip and tag events need to be keyed as Non-Kompass by the store?", "options": ["It's just a formality", "It's what triggers the location change in clicklist", "It speeds up shipping", "It's required for InstaWork billing"], "correct": 1, "explain": "Signing strip and tag events out as Non-Kompass is what flips the location in clicklist \u2014 remind stores to do it."}, {"q": "Which store has two inventory counts landing mid-week this week?", "options": ["Store 19", "Store 31 (Benson Plaza)", "Store 53", "Store 658"], "correct": 1, "explain": "Store 31 (Benson Plaza) has a home-side count Tuesday and an apparel count Wednesday \u2014 plan around the inventory crew those two days."}, {"q": "What's the mobility cane rack program's install window for District 8?", "options": ["This week only", "September 28 through October 10", "All of October", "It starts next year"], "correct": 1, "explain": "The Drive Medical cane rack install runs September 28 through October 10, one visit per store, staggered across all ten District 8 stores."}, {"q": "What has to be handed to pharmacy staff before leaving a store on the cane rack install?", "options": ["A spare set of hooks", "The laminated Cardinal reorder guide", "A signed byway", "Nothing extra"], "correct": 1, "explain": "A laminated reorder guide ships in the box \u2014 hand it to pharmacy staff before you leave, or they have nothing to reorder against."}];
const PERIOD_WEEK = "P09W2";
const ENDPOINT = "https://script.google.com/macros/s/AKfycbzmcP_mKbuBt-pY1zMGhgrgOWae3uI72PreeTaQTHJDc1Uj4oGq424zRRsdZ8YKo8c1/exec";
const answers = new Array(QUESTIONS.length).fill(null);
let locked = false;

const quizBody = document.getElementById('quizBody');
QUESTIONS.forEach((q, qi) => {
  const card = document.createElement('div');
  card.className = 'qcard';
  card.innerHTML = `<div class="qnum">QUESTION ${qi+1} OF ${QUESTIONS.length}</div><div class="qtext">${q.q}</div>`;
  const optWrap = document.createElement('div');
  q.options.forEach((optText, oi) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.type = 'button';
    btn.textContent = String.fromCharCode(65+oi) + '.  ' + optText;
    btn.addEventListener('click', () => {
      if (locked) return;
      answers[qi] = oi;
      Array.from(optWrap.children).forEach(c => c.classList.remove('selected'));
      btn.classList.add('selected');
      updateProgress();
    });
    optWrap.appendChild(btn);
  });
  card.appendChild(optWrap);
  const fb = document.createElement('div');
  fb.className = 'feedback';
  fb.id = 'fb-' + qi;
  card.appendChild(fb);
  quizBody.appendChild(card);
});

const nameInput = document.getElementById('nameInput');
const submitBtn = document.getElementById('submitBtn');
const progressFill = document.getElementById('progressFill');
const progressLabel = document.getElementById('progressLabel');

function updateProgress() {
  const answered = answers.filter(a => a !== null).length;
  progressFill.style.width = (answered / QUESTIONS.length * 100) + '%';
  progressLabel.textContent = answered + ' / ' + QUESTIONS.length + ' answered';
  checkReady();
}
nameInput.addEventListener('input', checkReady);
function checkReady() {
  const allAnswered = answers.every(a => a !== null);
  const hasName = nameInput.value.trim().length > 0;
  submitBtn.disabled = !(allAnswered && hasName);
}

function verdictFor(score, outOf) {
  const pct = score / outOf;
  if (score === outOf) return "Perfect. You were paying attention.";
  if (pct >= 0.8) return "Solid. Review the ones you missed.";
  if (pct >= 0.6) return "Watch the presentation again \u2014 key details were missed.";
  return "Go back and rewatch the full presentation before your next shift.";
}

submitBtn.addEventListener('click', () => {
  if (locked) return;
  locked = true;
  submitBtn.disabled = true;

  let score = 0;
  const missed = [];
  QUESTIONS.forEach((q, qi) => {
    const card = quizBody.children[qi];
    const optWrap = card.querySelector('div:nth-child(3)');
    const buttons = Array.from(optWrap.children);
    buttons.forEach(b => b.disabled = true);
    const chosen = answers[qi];
    const fb = document.getElementById('fb-' + qi);
    if (chosen === q.correct) {
      score++;
      buttons[chosen].classList.add('correct');
      fb.className = 'feedback show right';
      fb.textContent = q.explain;
    } else {
      buttons[chosen].classList.add('wrong');
      buttons[q.correct].classList.add('correct');
      fb.className = 'feedback show miss';
      fb.textContent = q.explain;
      missed.push(qi+1);
    }
  });

  const overlay = document.getElementById('overlay');
  const spinner = document.getElementById('spinner');
  const syncMsg = document.getElementById('syncMsg');
  overlay.classList.remove('hidden');

  const payload = {
    timestamp: new Date().toISOString(),
    periodWeek: PERIOD_WEEK,
    name: nameInput.value.trim(),
    score: score,
    outOf: QUESTIONS.length,
    percent: Math.round(score / QUESTIONS.length * 100),
    missedQuestions: missed.join(', ')
  };

  let postFailed = false;
  try {
    fetch(ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(payload)
    }).catch(() => { postFailed = true; });
  } catch (e) { postFailed = true; }

  setTimeout(() => {
    spinner.style.display = 'none';
    syncMsg.style.color = '#16a34a';
    syncMsg.textContent = 'Your results have been submitted.';
    setTimeout(() => {
      overlay.classList.add('hidden');
      showResult(score, QUESTIONS.length, postFailed);
    }, 2000);
  }, 1500);
});

function showResult(score, outOf, postFailed) {
  const resultArea = document.getElementById('resultArea');
  let verdict = verdictFor(score, outOf);
  if (postFailed) verdict += ' Screenshot this and send to Tyson.';
  resultArea.innerHTML = `
    <div class="result-card">
      <div class="result-score">${score} / ${outOf}</div>
      <div class="result-verdict">${verdict}</div>
    </div>`;
  resultArea.scrollIntoView({behavior:'smooth'});
}
</script>
</body>
</html>
