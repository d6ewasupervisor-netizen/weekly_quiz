<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>District 8 Weekly Quiz &mdash; P09W3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy:#1B2A4A; --teal:#0891B2; --orange:#F59E0B; --red:#DC2626;
    --lightyellow:#FEF3C7; --lightblue:#ECFEFF; --bg:#F0F4F8;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--navy); padding-bottom:60px; }
  header { background:var(--navy); color:#fff; padding:28px 20px 22px; text-align:center; }
  header .kicker { font-family:'Space Mono',monospace; color:#7dd3e0; letter-spacing:2px; font-size:13px; text-transform:uppercase; }
  header h1 { margin:8px 0 0; font-size:26px; }
  .progress-wrap { max-width:640px; margin:18px auto 0; padding:0 16px; }
  .progress-bar { background:#dde6ee; border-radius:999px; height:10px; overflow:hidden; }
  .progress-fill { background:linear-gradient(90deg,var(--teal),var(--orange)); height:100%; width:0%; transition:width .25s ease; }
  .progress-label { font-family:'Space Mono',monospace; font-size:12px; color:#46607a; margin-top:6px; text-align:right; }
  main { max-width:640px; margin:0 auto; padding:16px; }
  .name-card { background:#fff; border-radius:16px; padding:18px 20px; box-shadow:0 6px 18px rgba(27,42,74,.08); margin-bottom:20px; }
  .name-card label { font-weight:700; font-size:14px; display:block; margin-bottom:8px; }
  .name-card input { width:100%; padding:12px 14px; border-radius:10px; border:2px solid #dde6ee; font-size:16px; font-family:'DM Sans',sans-serif; }
  .name-card input:focus { outline:none; border-color:var(--teal); }
  .qcard { background:#fff; border-radius:16px; padding:20px; margin-bottom:16px; box-shadow:0 6px 18px rgba(27,42,74,.08); }
  .qnum { font-family:'Space Mono',monospace; color:var(--teal); font-size:12px; font-weight:700; letter-spacing:1px; }
  .qtext { font-weight:700; font-size:17px; margin:6px 0 14px; line-height:1.4; }
  .opt { display:block; width:100%; text-align:left; padding:12px 14px; margin-bottom:10px; border-radius:10px; border:2px solid #dde6ee; background:#fbfdff; font-size:15px; font-family:'DM Sans',sans-serif; cursor:pointer; transition:all .15s ease; }
  .opt:hover { border-color:var(--teal); }
  .opt.selected { border-color:var(--navy); background:#eef3f8; font-weight:700; }
  .opt.correct { background:#dcfce7; border-color:#16a34a; font-weight:700; }
  .opt.wrong { background:#fee2e2; border-color:var(--red); text-decoration:line-through; }
  .feedback { margin-top:10px; padding:12px 14px; border-radius:10px; font-size:14px; line-height:1.5; display:none; }
  .feedback.show { display:block; }
  .feedback.right { background:var(--lightblue); color:#0e5a6b; }
  .feedback.miss { background:var(--lightyellow); color:#92400e; }
  #submitBtn { width:100%; padding:16px; border:none; border-radius:12px; background:var(--navy); color:#fff; font-size:17px; font-weight:700; font-family:'DM Sans',sans-serif; cursor:pointer; margin-top:10px; }
  #submitBtn:disabled { background:#a9bcce; cursor:not-allowed; }
  .result-card { background:var(--navy); color:#fff; border-radius:16px; padding:26px 22px; text-align:center; margin-bottom:20px; }
  .result-score { font-family:'Space Mono',monospace; font-size:42px; font-weight:700; color:var(--orange); }
  .result-verdict { font-size:17px; margin-top:8px; }
  .overlay { position:fixed; inset:0; background:rgba(27,42,74,.92); display:flex; align-items:center; justify-content:center; z-index:999; }
  .overlay-box { background:#fff; border-radius:18px; padding:40px 36px; text-align:center; min-width:240px; }
  .spinner { width:44px; height:44px; border:5px solid #dde6ee; border-top-color:var(--teal); border-radius:50%; margin:0 auto 18px; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .sync-msg { font-weight:700; color:var(--navy); font-size:16px; }
  .hidden { display:none; }
</style>
</head>
<body>
<header>
  <div class="kicker">District 8 &middot; Weekly Check</div>
  <h1>P09W3 Quiz</h1>
</header>
<div class="progress-wrap">
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-label" id="progressLabel">0 / 20 answered</div>
</div>
<main>
  <div class="name-card">
    <label for="nameInput">Your name</label>
    <input type="text" id="nameInput" placeholder="Type your name" autocomplete="off">
  </div>
  <div id="quizBody"></div>
  <button id="submitBtn" disabled>Submit Quiz</button>
  <div id="resultArea"></div>
</main>

<div class="overlay hidden" id="overlay">
  <div class="overlay-box">
    <div class="spinner" id="spinner"></div>
    <div class="sync-msg" id="syncMsg">Buffering...</div>
  </div>
</div>

<script>
const QUESTIONS = [{"q": "What is the \"lightbulb project\" this week?", "options": ["A Money Services signage swap", "The Household Electric blitz, about 16 hours per store", "A fuel center lighting upgrade", "A Kompass NII in Laundry Additives"], "correct": 1, "explain": "The lightbulb project is the Household Electric blitz, running this week at about 16 hours per store."}, {"q": "Before starting the lightbulb blitz, who confirms the start date with you?", "options": ["The home manager", "The relay team", "The fuel center associate", "The pharmacy manager"], "correct": 0, "explain": "Confirm the blitz start date with the home manager, and ask them for totes for NOF/NIS product."}, {"q": "When is the lightbulb project being done?", "options": ["Period 10, Week 1", "Whenever the store is ready", "Period 9, Week 4", "This week"], "correct": 3, "explain": "The Household Electric blitz, the lightbulb project, is being done this week."}, {"q": "For the lightbulb blitz, what do you ask the home manager for besides the start date?", "options": ["Totes for anything not on file or not in the set", "Extra shopping carts for the stockroom", "The fuel center keys", "A copy of the planogram"], "correct": 0, "explain": "Confirm the start date and ask the home manager for totes for NOF/NIS product. Stores don't like shopping carts in the stockroom."}, {"q": "When is the Drive cane rack install now scheduled?", "options": ["It's been cancelled", "Period 9, Week 4", "Period 10, Week 1", "Period 9, Week 3"], "correct": 2, "explain": "The Drive cane rack moved from Period 9, Weeks 3 and 4 to Period 10, Week 1."}, {"q": "A cane rack fixture box shows up at your store this week. What do you do?", "options": ["Send it back to the vendor", "Keep it together and secured with your Kompass materials. Don't build it or toss it", "Build it now so it's done early", "Give it to the pharmacy to build"], "correct": 1, "explain": "Nothing gets built this week. Keep any cane rack materials together and secured for Period 10, Week 1, and don't toss any of it."}, {"q": "On cane rack install day, what goes to pharmacy staff before you leave?", "options": ["The survey printout", "The fixture box", "The old cane rack", "The laminated reorder guide"], "correct": 3, "explain": "The laminated reorder guide goes to pharmacy staff before you leave, or they have nothing to reorder against."}, {"q": "What's the new left-to-right flow for Frozen Multi-Serve?", "options": ["Globetrotter > Stouffer's > Meatballs > Skillet Meals > Private Selection", "Stouffer's > Skillet Meals > Globetrotter > Private Selection > Meatballs", "Private Selection > Stouffer's > Skillet Meals > Meatballs > Globetrotter", "Stouffer's > Meatballs > Skillet Meals > Private Selection > Globetrotter"], "correct": 3, "explain": "Stouffer's, then Meatballs, then Skillet Meals, then Private Selection, with Globetrotter inline at the far right."}, {"q": "If Globetrotter currently sits LEFT of Multi-Serve, what's the first move?", "options": ["Leave Globetrotter where it is", "Straight update with shelf adjustments", "Pull all Globetrotter product to the back freezer", "Set Globetrotter first, then Stouffer's"], "correct": 2, "explain": "Globetrotter on the left: pull it all to the back freezer, adjust the shelves, then move Stouffer's and the rest left into those doors."}, {"q": "How many boxes of Globetrotter overstock did the test store pull?", "options": ["5", "11", "2", "20"], "correct": 1, "explain": "Eleven boxes. Facings drop hard, so plan your freezer space before you start."}, {"q": "On NF Frozen Entrees, what do you do before moving any product?", "options": ["Check your shelf heights", "Pull close-outs", "Call the hotline", "Pull all Amy's to the freezer"], "correct": 0, "explain": "The planner calls for height changes, but the test store's heights were already right. Check yours first."}, {"q": "Which brands now lead NF Frozen Entrees on the left?", "options": ["Kevin's and Tattooed Chef", "Beecher's and Manini's", "Private Selection", "Amy's"], "correct": 0, "explain": "Kevin's and Tattooed Chef move from the middle to lead the set on the left, and Amy's moves to the middle and right."}, {"q": "The test store put Beecher's and Manini's items into NF Frozen Entrees. Where do they actually belong?", "options": ["Frozen Multi-Serve", "Frozen Desserts", "Ready To Heat Pizza", "Frozen Asian"], "correct": 0, "explain": "They're Frozen Multi-Serve items. Watch for this most when the two sets run on different visits."}, {"q": "What moves in bay 1 of Laundry Additives?", "options": ["Dryer sheets move to bay 3", "Suavitel moves from the top shelf to the bottom left", "Tide pods move to the top shelf", "Nothing. There are no shelf moves"], "correct": 1, "explain": "Suavitel comes down to the bottom left, and the lower shelves in bay 1 move to fit its height."}, {"q": "What should you pull first on Laundry Additives?", "options": ["The close-outs, since most aren't marked with tags", "The Suavitel", "The bleach set", "The top shelf"], "correct": 0, "explain": "The test store pulled two carts of close-outs, mostly without tags. Clearing them first gives you plenty of room."}, {"q": "Super Premium Juice is a produce priority set. When does it get done?", "options": ["Only on the second visit", "Last, after grocery", "First thing, unless the week already has a different priority", "Whenever the vendor arrives"], "correct": 2, "explain": "As a produce priority set, it gets done first unless the week already has a different priority."}, {"q": "Money Services fuel pump stickers: which rule is correct?", "options": ["Only replace stickers on pumps that look worn", "Place the new stickers over the old ones", "One sticker per pump, on the side facing the store", "Remove the old stickers first, then two new per side on every pump, never over existing signage"], "correct": 3, "explain": "Old stickers come off first. Then two new stickers per side, every pump, same spot each time, never over existing signage."}, {"q": "Money Services Credit Reinvention: where do you look for the kit first?", "options": ["The pharmacy", "The Customer Service Desk", "The back freezer", "The fuel center"], "correct": 1, "explain": "Look at the Customer Service Desk first, then the Kompass new item cart. If it's still missing, contact me before you start."}, {"q": "On the Credit endcap, what's the rule for pulling Account Funding cards?", "options": ["Pull only enough to fill the Credit endcap. Don't leave holes on the gift card endcap", "Leave the endcap empty until next week", "Order new cards instead", "Pull every card from the gift card endcap"], "correct": 0, "explain": "Pull only what you need, and don't leave holes on the gift card endcap."}, {"q": "What's the daily rhythm, in order?", "options": ["Cut-ins wrapped by 9 AM, out of the store by 2:30, EOD sent by 3 PM", "EOD by 3 PM, out by 2:30, cut-ins by 9 AM", "Cut-ins by 10 AM, out by 3, EOD by 4 PM", "Out by 2:30, cut-ins by 9 AM, EOD by 5 PM"], "correct": 0, "explain": "Cut-ins wrapped by 9 AM, out of the store by 2:30, and EOD sent by 3 PM. Tell me as soon as you're running behind."}];
const PERIOD_WEEK = "P09W3";
const ENDPOINT = "https://script.google.com/macros/s/AKfycbzmcP_mKbuBt-pY1zMGhgrgOWae3uI72PreeTaQTHJDc1Uj4oGq424zRRsdZ8YKo8c1/exec";
const answers = new Array(QUESTIONS.length).fill(null);
let locked = false;

const quizBody = document.getElementById('quizBody');
QUESTIONS.forEach((q, qi) => {
  const card = document.createElement('div');
  card.className = 'qcard';
  card.innerHTML = `<div class="qnum">QUESTION ${qi+1} OF ${QUESTIONS.length}</div><div class="qtext">${q.q}</div>`;
  const optWrap = document.createElement('div');
  q.options.forEach((optText, oi) => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.type = 'button';
    btn.textContent = String.fromCharCode(65+oi) + '.  ' + optText;
    btn.addEventListener('click', () => {
      if (locked) return;
      answers[qi] = oi;
      Array.from(optWrap.children).forEach(c => c.classList.remove('selected'));
      btn.classList.add('selected');
      updateProgress();
    });
    optWrap.appendChild(btn);
  });
  card.appendChild(optWrap);
  const fb = document.createElement('div');
  fb.className = 'feedback';
  fb.id = 'fb-' + qi;
  card.appendChild(fb);
  quizBody.appendChild(card);
});

const nameInput = document.getElementById('nameInput');
const submitBtn = document.getElementById('submitBtn');
const progressFill = document.getElementById('progressFill');
const progressLabel = document.getElementById('progressLabel');

function updateProgress() {
  const answered = answers.filter(a => a !== null).length;
  progressFill.style.width = (answered / QUESTIONS.length * 100) + '%';
  progressLabel.textContent = answered + ' / ' + QUESTIONS.length + ' answered';
  checkReady();
}
nameInput.addEventListener('input', checkReady);
function checkReady() {
  const allAnswered = answers.every(a => a !== null);
  const hasName = nameInput.value.trim().length > 0;
  submitBtn.disabled = !(allAnswered && hasName);
}

function verdictFor(score, outOf) {
  const pct = score / outOf;
  if (score === outOf) return "Perfect. You were paying attention.";
  if (pct >= 0.8) return "Solid. Review the ones you missed.";
  if (pct >= 0.6) return "Watch the presentation again \u2014 key details were missed.";
  return "Go back and rewatch the full presentation before your next shift.";
}

submitBtn.addEventListener('click', () => {
  if (locked) return;
  locked = true;
  submitBtn.disabled = true;

  let score = 0;
  const missed = [];
  QUESTIONS.forEach((q, qi) => {
    const card = quizBody.children[qi];
    const optWrap = card.querySelector('div:nth-child(3)');
    const buttons = Array.from(optWrap.children);
    buttons.forEach(b => b.disabled = true);
    const chosen = answers[qi];
    const fb = document.getElementById('fb-' + qi);
    if (chosen === q.correct) {
      score++;
      buttons[chosen].classList.add('correct');
      fb.className = 'feedback show right';
      fb.textContent = q.explain;
    } else {
      buttons[chosen].classList.add('wrong');
      buttons[q.correct].classList.add('correct');
      fb.className = 'feedback show miss';
      fb.textContent = q.explain;
      missed.push(qi+1);
    }
  });

  const overlay = document.getElementById('overlay');
  const spinner = document.getElementById('spinner');
  const syncMsg = document.getElementById('syncMsg');
  overlay.classList.remove('hidden');

  const payload = {
    timestamp: new Date().toISOString(),
    periodWeek: PERIOD_WEEK,
    name: nameInput.value.trim(),
    score: score,
    outOf: QUESTIONS.length,
    percent: Math.round(score / QUESTIONS.length * 100),
    missedQuestions: missed.join(', ')
  };

  let postFailed = false;
  try {
    fetch(ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(payload)
    }).catch(() => { postFailed = true; });
  } catch (e) { postFailed = true; }

  setTimeout(() => {
    spinner.style.display = 'none';
    syncMsg.style.color = '#16a34a';
    syncMsg.textContent = 'Your results have been submitted.';
    setTimeout(() => {
      overlay.classList.add('hidden');
      showResult(score, QUESTIONS.length, postFailed);
    }, 2000);
  }, 1500);
});

function showResult(score, outOf, postFailed) {
  const resultArea = document.getElementById('resultArea');
  let verdict = verdictFor(score, outOf);
  if (postFailed) verdict += ' Screenshot this and send it to me.';
  resultArea.innerHTML = `
    <div class="result-card">
      <div class="result-score">${score} / ${outOf}</div>
      <div class="result-verdict">${verdict}</div>
    </div>`;
  resultArea.scrollIntoView({behavior:'smooth'});
}
</script>
</body>
</html>
